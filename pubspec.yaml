name: golmok_flutter
description: 골목대장 Flutter 버전 - 디자인 보드 화면 흐름 + 폰 안 데이터베이스(SQLite)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0   # 만화풍 지도 (MapLibre GL JS를 WebView 안에서)
  sqflite: ^2.3.3            # 폰 안 데이터베이스
  path: ^1.9.0
  geolocator: ^13.0.1        # 산책 위치
  supabase_flutter: ^2.8.0   # 서버: 이메일 계정, 기록 동기화, 피드, 리더보드
  image_picker: ^1.1.2       # 사진 찍기 · 앨범에서 고르기
  path_provider: ^2.1.4      # 사진을 넣어 둘 앱 폴더
  gal: ^3.0.1
  share_plus: ^13.3.1
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3   # 앱 아이콘 (빌드할 때 assets/icon/icon.png 로 만든다)

# 앱 아이콘: 초록 지도 핀 속 참새 (원본 assets/icon/sparrow-pin-original.png)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  # 안드로이드 적응형 아이콘: 크림색 바탕 + 가운데를 조금 줄인 핀 (폰마다 동그랗게 잘려도 핀이 안 잘림)
  adaptive_icon_background: "#FDF6E6"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/map/stickers/
    - assets/images/
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
