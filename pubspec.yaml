name: golmok_flutter
description: 골목대장 Flutter 버전 - 디자인 보드 화면 흐름 + 폰 안 데이터베이스(SQLite)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0   # 만화풍 지도 (MapLibre GL JS를 WebView 안에서)
  sqflite: ^2.3.3            # 폰 안 데이터베이스
  path: ^1.9.0
  geolocator: ^13.0.1        # 산책 위치
  supabase_flutter: ^2.8.0   # 서버: 이메일 계정, 기록 동기화, 피드, 리더보드
  image_picker: ^1.1.2       # 사진 찍기 · 앨범에서 고르기
  path_provider: ^2.1.4      # 사진을 넣어 둘 앱 폴더

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3   # 앱 아이콘 (빌드할 때 assets/icon/icon.png 로 만든다)

# 앱 아이콘: 초록 안개 속 구름 창으로 보이는 만화풍 지도 + 산책 고양이 (원본 assets/icon/icon.svg)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  # 안드로이드 적응형 아이콘: 그림 전체를 배경으로, 앞쪽은 비워 둔다 (가운데 구름 창이 잘리지 않음)
  adaptive_icon_background: assets/icon/icon.png
  adaptive_icon_foreground: assets/icon/transparent.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/map/stickers/
    - assets/images/
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
