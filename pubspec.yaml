name: golmok_flutter
description: 골목대장 Flutter 버전 - 디자인 보드 화면 흐름 + 폰 안 데이터베이스(SQLite)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0   # 만화풍 지도 (MapLibre GL JS를 WebView 안에서)
  sqflite: ^2.3.3            # 폰 안 데이터베이스
  path: ^1.9.0
  geolocator: ^13.0.1        # 산책 위치

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/map/stickers/
    - assets/images/
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
