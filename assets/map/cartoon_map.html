<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>골목대장 지도</title>
<!--
  만화풍 지도 + 지도 테마 7가지 (THEMES: pastel 기본 / night / treasure / sketch / watercolor / sakura / retro)
  - 지도 데이터: OpenStreetMap / 타일: OpenFreeMap (무료, 키 없음) / 그리는 엔진: MapLibre GL JS
  - 테마마다 색뿐 아니라 선 모양·무늬·글씨체·종이 질감·테두리·움직임이 다르다. 시안은 Flutter 쪽 설정 > 지도 테마에서 고른다.
  Flutter와 주고받는 방법
  - Flutter → 지도: window.boot(테마) (페이지가 열리면 한 번), window.setTheme(테마), window.goTo(경도, 위도, 확대),
    window.setDecos(꾸미기, 고치는 중?, 고른 id), window.stamp(기록 id, 날아오기?) …
  - 지도 → Flutter: Golmok 채널로 {"type":"ready"} / {"type":"move", lat, lng, zoom} / {"type":"tap", kind, id}
    / {"type":"decoTap", id} / {"type":"decoMove", id, lat, lng} / {"type":"mapTap", lat, lng} / {"type":"stamped", id}
-->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; background: #FFF9ED; overflow: hidden; }
  .wobble .maplibregl-canvas, .wobble .fog-canvas { filter: url(#wobble); }
  /* 테마 장식(종이 질감·테두리·꽃잎 등)은 지도와 안개 위, 스티커 아래 */
  .theme-ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .maplibregl-marker { z-index: 2; }
  /* 지도 꾸미기 */
  .deco { display: flex; align-items: center; justify-content: center; border-radius: 12px; touch-action: none; }
  .deco img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 2px 0 #24322C); pointer-events: none; }
  .deco-text { font-family: 'Jua', sans-serif; color: #0E5A3C; white-space: nowrap; line-height: 1; padding: 2px 6px;
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff; }
  .deco.view { pointer-events: none; }
  .deco.sel { outline: 3px dashed #F39A45; outline-offset: 3px; }
  /* 스티커 붙일 자리 고르기 */
  /* 바깥 .pick은 지도가 자리를 옮기는 데 쓰므로(transform) 움직임은 안쪽 div에만 준다 */
  .pick { width: 46px; height: 46px; pointer-events: none; }
  .pick > div { width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: 3px dashed #F39A45; background: rgba(255,255,255,.55);
    display: flex; align-items: center; justify-content: center; font: 700 26px sans-serif; color: #A4500B; animation: pick 1.1s ease-in-out infinite; }
  @keyframes pick { 50% { transform: scale(1.15); } }
  /* 스티커 콩 찍기 */
  .kong { position: absolute; left: 50%; bottom: -2px; pointer-events: none; }
  .kong-ring { width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 3px solid #F39A45; border-radius: 50%; }
  .kong-dot { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #FFE19A; border: 1.5px solid #24322C; }
  .kong-text { bottom: auto; top: -14px; font-family: 'Jua', sans-serif; font-size: 18px; color: #A4500B; white-space: nowrap; transform: translateX(-50%);
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</svg>
<!-- 손그림 흔들림(wobble)은 기본 꺼짐: 안드로이드만 적용되고 iOS(WebKit)는 무시해서 두 폰 모양이 달랐음 -->
<div id="map"></div>
<script>
function post(o) { if (window.Golmok) Golmok.postMessage(JSON.stringify(o)); }

// ───────── 지도 그리기 공통 ─────────
const nameKo = ['coalesce', ['get', 'name:ko'], ['get', 'name']];
const z = (a, b) => ['interpolate', ['exponential', 1.5], ['zoom'], 12, a, 18, b];
const MINOR = ['minor', 'service', 'track'];
const MAJOR = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary'];
const isMinor = ['in', ['get', 'class'], ['literal', MINOR]];
const isMajor = ['in', ['get', 'class'], ['literal', MAJOR]];
const isRoad = ['any', isMinor, isMajor];
const isPath = ['==', ['get', 'class'], 'path'];
const isRes = ['==', ['get', 'class'], 'residential'];
const round = { 'line-cap': 'round', 'line-join': 'round' };
const SQUARE = { 'line-cap': 'square', 'line-join': 'miter' }; // 각진 길 (레트로)
const road = (id, f, paint, layout) => ({ id, type: 'line', source: 'omt', 'source-layer': 'transportation', filter: f, paint, ...(layout ? { layout } : {}) });
const fill = (id, layer, paint, extra) => ({ id, type: 'fill', source: 'omt', 'source-layer': layer, paint, ...(extra || {}) });
const line = (id, layer, paint, extra) => ({ id, type: 'line', source: 'omt', 'source-layer': layer, paint, ...(extra || {}) });
const bg = (c) => ({ id: 'land', type: 'background', paint: { 'background-color': c } });
function labels(o) {
  const hl = (c, w) => ({ 'text-color': c, 'text-halo-color': o.halo, 'text-halo-width': w });
  const sz = o.size || 13;
  return [
    { id: 'road-label', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 15, layout: { 'symbol-placement': 'line', 'text-field': nameKo, 'text-font': ['Noto Sans Regular'], 'text-size': sz }, paint: hl(o.road, 2) },
    { id: 'water-label', type: 'symbol', source: 'omt', 'source-layer': 'water_name', layout: { 'text-field': nameKo, 'text-font': ['Noto Sans Regular'], 'text-size': sz + 1 }, paint: hl(o.water || o.place, 2) },
    { id: 'poi-label', type: 'symbol', source: 'omt', 'source-layer': 'poi', minzoom: 16, filter: ['<=', ['get', 'rank'], 20], layout: { 'text-field': nameKo, 'text-font': ['Noto Sans Regular'], 'text-size': sz - 1, 'text-max-width': 7 }, paint: hl(o.poi || o.road, 1.6) },
    { id: 'place-label', type: 'symbol', source: 'omt', 'source-layer': 'place', layout: { 'text-field': nameKo, 'text-font': ['Noto Sans Bold'], 'text-size': ['match', ['get', 'class'], 'city', sz + 9, 'town', sz + 6, sz + 4] }, paint: hl(o.place, 2.5) },
  ];
}

// 무늬(패턴) 32칸 그림
function makePattern(draw, s = 32) {
  const cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'); draw(g, s); return g.getImageData(0, 0, s, s);
}
const P = {
  waves: (bgc, fg, a = 0.85) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s); g.strokeStyle = fg; g.globalAlpha = a; g.lineWidth = 2; g.lineCap = 'round';
    for (const y of [9, 25]) { const off = y === 25 ? 8 : 0; g.beginPath(); for (let x = -8; x <= s + 8; x++) g.lineTo(x + off, y + Math.sin((x / s) * Math.PI * 2) * 2.5); g.stroke(); }
  }),
  grass: (bgc, fg) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s); g.strokeStyle = fg; g.lineWidth = 1.6; g.lineCap = 'round';
    for (const [x, y] of [[7, 10], [23, 26]]) { g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x - 1, y - 4); g.moveTo(x, y); g.lineTo(x, y - 5); g.moveTo(x + 3, y); g.lineTo(x + 1, y - 4); g.stroke(); }
  }),
  hatch: (bgc, fg, w = 1.2, gap = 6) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s); g.strokeStyle = fg; g.lineWidth = w;
    for (let k = -s; k < s * 2; k += gap) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k - s, s); g.stroke(); }
  }),
  cross: (bgc, fg) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s); g.strokeStyle = fg; g.lineWidth = 0.9;
    for (let k = -s; k < s * 2; k += 5) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k - s, s); g.stroke(); g.beginPath(); g.moveTo(k - s, 0); g.lineTo(k, s); g.stroke(); }
  }),
  windows: (bgc, lit, dark) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s);
    for (let y = 3; y < s; y += 8) for (let x = 3; x < s; x += 8) { g.fillStyle = hash01(x, y, 3) < 0.45 ? lit : dark; g.fillRect(x, y, 4, 4); }
  }),
  trees: (bgc, fg) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s); g.strokeStyle = fg; g.lineWidth = 1.3;
    for (const [x, y] of [[8, 12], [24, 28]]) { g.beginPath(); g.arc(x, y - 4, 4, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 3); g.stroke(); }
  }),
  flowers: (bgc, petal, mid) => makePattern((g, s) => {
    g.fillStyle = bgc; g.fillRect(0, 0, s, s);
    for (const [x, y] of [[8, 9], [24, 25]]) {
      g.fillStyle = petal; for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5; g.beginPath(); g.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2.3, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = mid; g.beginPath(); g.arc(x, y, 1.6, 0, Math.PI * 2); g.fill();
    }
  }),
  checker: (a, b) => makePattern((g, s) => { g.fillStyle = a; g.fillRect(0, 0, s, s); g.fillStyle = b; g.fillRect(0, 0, s / 2, s / 2); g.fillRect(s / 2, s / 2, s / 2, s / 2); }),
};

// 늘 같은 순서로 나오는 난수 (테마 장식 모양이 켤 때마다 바뀌지 않게)
function seeded(n) { let x = n; return () => (x = (x * 16807) % 2147483647) / 2147483647; }

// 종이 질감 그림 (CSS 배경으로 깔고 multiply로 섞는다)
const paperCache = {};
function paperURL(key, dots, alpha, fibers) {
  if (paperCache[key]) return paperCache[key];
  const rnd = seeded(key.length * 7919 + 13);
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s; const g = cv.getContext('2d');
  const im = g.createImageData(s, s);
  for (let i = 0; i < im.data.length; i += 4) {
    const d = (rnd() - 0.5) * alpha * 255;
    im.data[i] = 238 + d; im.data[i + 1] = 236 + d; im.data[i + 2] = 230 + d; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  if (fibers) { g.strokeStyle = fibers; g.lineWidth = 0.6; for (let k = 0; k < 40; k++) { g.beginPath(); const x = rnd() * s, y = rnd() * s; g.moveTo(x, y); g.quadraticCurveTo(x + 10, y + rnd() * 8 - 4, x + 18 + rnd() * 10, y + rnd() * 10 - 5); g.stroke(); } }
  for (let k = 0; k < dots; k++) { g.fillStyle = `rgba(90,60,30,${rnd() * 0.08})`; g.beginPath(); g.arc(rnd() * s, rnd() * s, rnd() * 18 + 4, 0, Math.PI * 2); g.fill(); }
  return (paperCache[key] = cv.toDataURL());
}

function mPerPxNow() { return 40075016.686 * Math.cos(map.getCenter().lat * Math.PI / 180) / (512 * Math.pow(2, map.getZoom())); }
// 지도에 붙어 있는 장식(구멍·얼룩)을 정해진 칸 자리마다 그린다 (지도와 같이 움직임)
function eachAnchored(cellM, salt, prob, fn) {
  const b = map.getBounds(), dLat = cellM / 111320, dLng = cellM / (111320 * Math.cos(37.5 * Math.PI / 180));
  const i0 = Math.floor(b.getSouth() / dLat) - 1, i1 = Math.floor(b.getNorth() / dLat) + 1;
  const j0 = Math.floor(b.getWest() / dLng) - 1, j1 = Math.floor(b.getEast() / dLng) + 1;
  if ((i1 - i0) * (j1 - j0) > 900) return;
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    if (hash01(i, j, salt) > prob) continue;
    const la = (i + 0.2 + 0.6 * hash01(i, j, salt + 1)) * dLat, ln = (j + 0.2 + 0.6 * hash01(i, j, salt + 2)) * dLng;
    fn(map.project([ln, la]), i, j);
  }
}
// 울퉁불퉁한 덩어리 모양
function blob(g, x, y, r, i, j, salt, n = 14, rough = 0.35) {
  g.beginPath();
  for (let k = 0; k <= n; k++) {
    const a = k / n * Math.PI * 2, rr = r * (1 - rough / 2 + rough * hash01(i * 31 + (k % n), j, salt));
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}

// 테마 장식 도구: 테마를 바꾸면 dispose()로 모두 치운다
function overlayKit() {
  const host = map.getCanvasContainer(), els = [];
  const kit = {
    alive: true,
    size() { const c = map.getContainer(); return [c.clientWidth, c.clientHeight]; },
    div(css) { const d = document.createElement('div'); d.className = 'theme-ov'; d.style.cssText += css; host.appendChild(d); els.push(d); return d; },
    // draw(g, W, H): 크기가 바뀔 때마다 다시 그린다
    canvas(draw) {
      const c = document.createElement('canvas'); c.className = 'theme-ov'; host.appendChild(c); els.push(c);
      const g = c.getContext('2d');
      const fit = () => { const r = window.devicePixelRatio || 1, [W, H] = kit.size(); c.width = Math.round(W * r); c.height = Math.round(H * r); g.setTransform(r, 0, 0, r, 0, 0); if (draw) draw(g, W, H); };
      fit(); map.on('resize', fit);
      return { c, g, redraw: () => { const r = window.devicePixelRatio || 1; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.setTransform(r, 0, 0, r, 0, 0); if (draw) draw(g, ...kit.size()); } };
    },
    // 초당 약 30번 (배터리 아끼기)
    loop(fn) { let last = 0; const tick = (t) => { if (!kit.alive) return; if (t - last > 33) { fn(t, Math.min(80, t - last) / 1000); last = t; } requestAnimationFrame(tick); }; requestAnimationFrame(tick); },
    dispose() { kit.alive = false; els.forEach((e) => e.remove()); },
  };
  return kit;
}

// ───────── 테마 ─────────
// 각 테마: font(지도 글씨체), fog(안개 색), route(내 경로·위치 색), images()(무늬), layers()(지도 층), decorate(kit)(장식)
const ROUTE = { old: '#2F8A61', casing: '#24322C', line: '#F39A45', me: '#0E5A3C' };
const THEMES = {
  pastel: {
    name: '골목 파스텔', font: 'Jua',
    images: () => ({ 'grass-dots': P.grass('#C3E6CB', '#5FAE78'), waves: P.waves('#A6D6F2', '#fff') }),
    layers: () => {
      const INK = '#24322C', CAS = 3.5;
      return [
        bg('#FFF9ED'),
        fill('residential', 'landuse', { 'fill-color': '#FBF1DC' }, { filter: isRes }),
        fill('landcover', 'landcover', { 'fill-color': ['match', ['get', 'class'], 'wood', '#A8D8B4', '#CFEBD5'] }),
        fill('park', 'park', { 'fill-pattern': 'grass-dots' }), line('park-line', 'park', { 'line-color': '#5FAE78', 'line-width': 2 }),
        fill('water', 'water', { 'fill-pattern': 'waves' }), line('water-line', 'water', { 'line-color': INK, 'line-width': 2.2 }),
        line('waterway', 'waterway', { 'line-color': '#A6D6F2', 'line-width': z(1, 6) }),
        fill('building-shadow', 'building', { 'fill-color': INK, 'fill-opacity': 0.85, 'fill-translate': [3, 3] }, { minzoom: 14 }),
        fill('building', 'building', { 'fill-color': '#FDE3CC' }, { minzoom: 13 }), line('building-line', 'building', { 'line-color': INK, 'line-width': 1.4 }, { minzoom: 14 }),
        { ...road('path', isPath, { 'line-color': '#C2620F', 'line-width': z(0.8, 2.5), 'line-dasharray': [1.5, 1.5] }, { 'line-cap': 'round' }), minzoom: 14 },
        road('minor-casing', isMinor, { 'line-color': INK, 'line-width': z(0.5 + CAS * 0.6, 10 + CAS) }, round),
        road('major-casing', isMajor, { 'line-color': INK, 'line-width': z(1.5 + CAS * 0.6, 18 + CAS) }, round),
        road('minor', isMinor, { 'line-color': '#FFFFFF', 'line-width': z(0.5, 10) }, round),
        road('major', isMajor, { 'line-color': '#FFE19A', 'line-width': z(1.5, 18) }, round),
        ...labels({ halo: '#FFFFFF', road: INK, place: '#0E5A3C', water: '#1F5F86', poi: '#5E6A63' }),
      ];
    },
  },

  night: {
    name: '밤 산책', font: 'Do Hyeon', bg: '#1B2140', fog: 'rgba(6, 9, 22, 0.55)',
    route: { old: '#8CE0FF', casing: '#070B18', line: '#F39A45', me: '#FFE6A3' },
    images: () => ({ trees: P.trees('#1F3A40', '#3F7A66'), waves: P.waves('#10304E', '#5A8FC0', 0.6), win: P.windows('#2C3358', '#FFD46B', '#232948') }),
    layers: () => [
      bg('#1B2140'),
      fill('residential', 'landuse', { 'fill-color': '#1F2647' }, { filter: isRes }),
      fill('landcover', 'landcover', { 'fill-color': '#1E3640' }), fill('park', 'park', { 'fill-pattern': 'trees' }),
      fill('water', 'water', { 'fill-pattern': 'waves' }),
      fill('building-shadow', 'building', { 'fill-color': '#070B18', 'fill-opacity': 0.9, 'fill-translate': [3, 3] }, { minzoom: 14 }),
      fill('building', 'building', { 'fill-pattern': 'win' }, { minzoom: 13 }), line('building-line', 'building', { 'line-color': '#0B1022', 'line-width': 1.2 }, { minzoom: 14 }),
      road('minor', isMinor, { 'line-color': '#3A4270', 'line-width': z(0.8, 9) }, round),
      // 가로등 번짐: 넓고 흐린 노란 선 위에 밝은 선
      road('major-glow', isMajor, { 'line-color': '#FFC94D', 'line-width': z(6, 40), 'line-blur': z(5, 28), 'line-opacity': 0.45 }, round),
      road('major', isMajor, { 'line-color': '#FFE6A3', 'line-width': z(1.5, 12) }, round),
      { ...road('path', isPath, { 'line-color': '#8CE0FF', 'line-width': z(0.8, 2.2), 'line-dasharray': [0.5, 2], 'line-opacity': 0.8 }, { 'line-cap': 'round' }), minzoom: 14 },
      ...labels({ halo: '#0B1022', road: '#C9D2FF', place: '#FFE9A8', water: '#8FC4F0', size: 14 }),
    ],
    decorate(kit) {
      kit.div('background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(5,8,20,0.6) 100%)');
      const rnd = seeded(42);
      const stars = Array.from({ length: 36 }, () => [rnd(), rnd() * 0.4, rnd() * 6]);
      const cv = kit.canvas();
      kit.loop((t) => {
        const [W, H] = kit.size(); cv.g.clearRect(0, 0, W, H);
        for (const [x, y, p] of stars) {
          const a = (0.35 + 0.65 * Math.abs(Math.sin(t / 900 + p))) * (1 - y / 0.4);
          cv.g.fillStyle = `rgba(255,240,200,${a * 0.9})`; const s = p > 5 ? 2 : 1.2;
          cv.g.fillRect(x * W, y * H, s, s);
          if (p > 5.3) { cv.g.fillRect(x * W - 3, y * H + 0.5, 7, 0.8); cv.g.fillRect(x * W + 0.5, y * H - 3, 0.8, 7); }
        }
      });
    },
  },

  treasure: {
    name: '보물 지도', font: 'Song Myung', bg: '#EFDCAE', fog: 'rgba(92, 64, 34, 0.42)',
    route: { old: '#A8321E', casing: '#4A2E17', line: '#D9822B', me: '#7A1E10' },
    images: () => ({ trees: P.trees('#DCCF95', '#7A6A35'), waves: P.waves('#A9C9B8', '#4E6B5C', 0.7), hatch: P.hatch('#E6CF9C', '#8A5A2B', 1, 5) }),
    layers: () => {
      const INK = '#4A2E17';
      return [
        bg('#EFDCAE'),
        fill('landcover', 'landcover', { 'fill-color': '#DCCF95', 'fill-opacity': 0.8 }), fill('park', 'park', { 'fill-pattern': 'trees' }),
        fill('water', 'water', { 'fill-pattern': 'waves' }),
        line('water-line', 'water', { 'line-color': INK, 'line-width': 1.6 }),

// 테마 글씨체 (구글 글꼴). 한글 글자 조각을 미리 받아 둬야 지도 글자가 그 글씨체로 그려진다.
// 인터넷이 느리거나 없으면 몇 초만 기다리고 기본 글씨체로 그린다.
const FONT_CSS = { 'Jua': 'Jua', 'Do Hyeon': 'Do+Hyeon', 'Song Myung': 'Song+Myung', 'Gaegu': 'Gaegu:wght@700', 'Nanum Pen Script': 'Nanum+Pen+Script', 'Gamja Flower': 'Gamja+Flower' };
const HANGUL = Array.from({ length: 11172 }, (_, k) => String.fromCharCode(0xAC00 + k)).join('');
const fontsDone = {};
function loadFont(f) {
  if (fontsDone[f]) return fontsDone[f];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  fontsDone[f] = (async () => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=' + FONT_CSS[f] + '&display=swap';
    const css = new Promise((r) => { l.onload = r; l.onerror = r; });
    document.head.appendChild(l);
    await Promise.race([css, wait(3000)]);
    await Promise.race([document.fonts.load('20px "' + f + '"', HANGUL).catch(() => {}), wait(4000)]);
  })();
  return fontsDone[f];
}

let map;
let ready = false;
const queue = [];
// 지도가 준비되기 전(또는 테마를 바꿔 다시 그리는 중)에 Flutter가 보낸 명령은 모아 뒀다가 준비되면 실행한다.
function whenReady(fn) { if (ready) fn(); else queue.push(fn); }

// ── 안개: Flutter의 lib/data/geo.dart 와 같은 격자(20m 칸) ──
const CELL_M = 20, M_PER_DEG_LAT = 111320;
const D_LAT = CELL_M / M_PER_DEG_LAT;
const D_LNG = CELL_M / (M_PER_DEG_LAT * Math.cos(37.5 * Math.PI / 180));
let explored = new Set();
let fogOn = true;

// 안개는 지도 위에 얹은 투명한 캔버스에 그린다.
// 밝힌 칸마다 크기가 조금씩 다른 동그라미로 구멍을 뚫어서, 안개 가장자리가 구름처럼 몽글몽글해진다.
const FOG_DEFAULT = 'rgba(112, 120, 114, 0.5)';
let FOG_COLOR = FOG_DEFAULT;
let fogCanvas = null, fogCtx = null, fogQueued = false;

// 칸마다 늘 같은 값이 나오는 0~1 난수 (그릴 때마다 모양이 바뀌지 않게)
function hash01(i, j, salt) {
  let h = (i * 374761393 + j * 668265263 + salt * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function setupFogCanvas() {
  fogCanvas = document.createElement('canvas');
  fogCanvas.className = 'fog-canvas';
  fogCanvas.setAttribute('aria-hidden', 'true');
  fogCanvas.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none';
  const mc = map.getCanvas();
  mc.parentNode.insertBefore(fogCanvas, mc.nextSibling); // 지도 바로 위, 스티커 표시보다 아래
  fogCtx = fogCanvas.getContext('2d');
  resizeFog();
}

function resizeFog() {
  if (!fogCanvas) return;
  const r = window.devicePixelRatio || 1;
  const c = map.getContainer();
  fogCanvas.width = Math.round(c.clientWidth * r);
  fogCanvas.height = Math.round(c.clientHeight * r);
  drawFog();
}

function renderFog() {
  if (fogQueued) return;
  fogQueued = true;
  requestAnimationFrame(() => { fogQueued = false; drawFog(); });
}

function drawFog() {
  if (!fogCtx || !map) return;
  const ctx = fogCtx, r = window.devicePixelRatio || 1;
  const W = fogCanvas.width, H = fogCanvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!fogOn) return;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = FOG_COLOR;
  ctx.fillRect(0, 0, W / r, H / r);

  // 지금 화면에 보이는 칸만 그린다
  const b = map.getBounds();
  const i0 = Math.floor(b.getSouth() / D_LAT) - 2, i1 = Math.floor(b.getNorth() / D_LAT) + 2;
  const j0 = Math.floor(b.getWest() / D_LNG) - 2, j1 = Math.floor(b.getEast() / D_LNG) + 2;
  const cells = [];
  if ((i1 - i0 + 1) * (j1 - j0 + 1) < 60000) {
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) if (explored.has(i + ':' + j)) cells.push([i, j]);
  } else {
    for (const k of explored) {
      const [i, j] = k.split(':').map(Number);
      if (i >= i0 && i <= i1 && j >= j0 && j <= j1) cells.push([i, j]);
    }
  }
  if (!cells.length) return;

  // 1미터가 화면에서 몇 픽셀인지
  const lat = map.getCenter().lat;
  const mPerPx = 40075016.686 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, map.getZoom()));
  const cellPx = CELL_M / mPerPx;
  const holes = cells.map(([i, j]) => {
    const p = map.project([(j + 0.5 + (hash01(i, j, 1) - 0.5) * 0.3) * D_LNG, (i + 0.5 + (hash01(i, j, 2) - 0.5) * 0.3) * D_LAT]);
    return [p.x, p.y, cellPx * (0.75 + hash01(i, j, 3) * 0.25)];
  });

  // 동그라미로 안개를 걷어 낸다
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  ctx.beginPath();
  for (const [x, y, rad] of holes) { ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, Math.PI * 2); }
  ctx.fill();

  // 남은 안개의 가장자리에만 하얀 테두리 (구름 느낌)
  if (cellPx > 4) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.lineWidth = Math.min(4, Math.max(1.5, cellPx * 0.1));
    ctx.beginPath();
    for (const [x, y, rad] of holes) { const rr = rad + ctx.lineWidth * 0.4; ctx.moveTo(x + rr, y); ctx.arc(x, y, rr, 0, Math.PI * 2); }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

const lineF = (coords) => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
const EMPTY = { type: 'FeatureCollection', features: [] };
let spotMarkers = [];
let decoMarkers = [];
let decoTouchedAt = 0; // 꾸미기를 누른 시각 (같은 누름이 지도 빈 곳 누름으로도 잡히지 않게)

// 마지막으로 받은 내용 (테마를 바꿔 지도를 새로 만들 때 다시 올린다)
const last = { path: [], old: [], me: null, spots: [], decos: [[], false, null] };

function applyPath() { map.getSource('path').setData(lineF(last.path.length > 1 ? last.path : [])); }
function applyOld() { map.getSource('oldpaths').setData({ type: 'FeatureCollection', features: last.old.filter((p) => p.length > 1).map(lineF) }); }
function applyMe() { map.getSource('me').setData(last.me ? { type: 'Feature', geometry: { type: 'Point', coordinates: last.me } } : EMPTY); }

function drawSpots() {
  spotMarkers.forEach((m) => m.remove());
  spotMarkers = last.spots.map((it) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.setAttribute('aria-label', it.label || '기록');
    const size = it.kind === 'spot' ? 46 : 40;
    // position은 건드리지 않는다: 지도 표시는 position:absolute여야 자리에 고정된다 (relative로 바꾸면 확대·축소할 때 스티커가 밀려남)
    el.style.cssText = 'overflow:visible;width:' + size + 'px;height:' + size + 'px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(2px 2px 0 #24322C)' + (it.kind === 'stamp' ? ';opacity:.55' : '');
    const img = document.createElement('img');
    img.src = 'stickers/' + it.sticker + '.webp';
    img.alt = '';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain';
    el.appendChild(img);
    el.addEventListener('click', (e) => { e.stopPropagation(); post({ type: 'tap', kind: it.kind, id: it.id }); });
    const m = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([it.lng, it.lat]).addTo(map);
    m._gid = it.id;
    return m;
  });
}

function drawDecos() {
  const [items, editing, selected] = last.decos;
  decoMarkers.forEach((m) => m.remove());
  decoMarkers = items.map((it) => {
    const el = document.createElement('div');
    el.className = 'deco' + (editing ? '' : ' view') + (it.id === selected ? ' sel' : '');
    if (it.sticker) {
      el.style.width = el.style.height = it.size + 'px';
      const img = document.createElement('img');
      img.src = 'stickers/' + it.sticker + '.webp';
      img.alt = '';
      el.appendChild(img);
    } else {
      el.classList.add('deco-text');
      el.style.fontSize = Math.round(it.size / 3) + 'px';
      el.textContent = it.text || '';
    }
    const m = new maplibregl.Marker({ element: el, anchor: 'center', draggable: !!editing }).setLngLat([it.lng, it.lat]).addTo(map);
    if (editing) {
      el.addEventListener('pointerdown', () => { decoTouchedAt = Date.now(); });
      el.addEventListener('click', (e) => { e.stopPropagation(); decoTouchedAt = Date.now(); post({ type: 'decoTap', id: it.id }); });
      m.on('dragstart', () => { decoTouchedAt = Date.now(); post({ type: 'decoTap', id: it.id }); });
      m.on('dragend', () => { const p = m.getLngLat(); post({ type: 'decoMove', id: it.id, lat: p.lat, lng: p.lng }); });
    }
    return m;
  });
}

window.goTo = (lng, lat, zoom) => whenReady(() => map.flyTo({ center: [lng, lat], zoom: zoom || map.getZoom(), speed: 1.6 }));
window.setWobble = (on) => document.getElementById('map').classList.toggle('wobble', !!on);
window.setFog = (on) => { fogOn = !!on; whenReady(renderFog); };
window.setExplored = (keys) => { explored = new Set(keys); whenReady(renderFog); };
window.addExplored = (keys) => { keys.forEach((k) => explored.add(k)); whenReady(renderFog); };
/** 산책 경로. coords = [[경도, 위도], ...] */
window.setPath = (coords) => { last.path = coords; whenReady(applyPath); };
/** 지난 산책 경로들 (내 지도). paths = [[[경도, 위도], ...], ...] */
window.setOldPaths = (paths) => { last.old = paths; whenReady(applyOld); };
window.setMe = (lng, lat) => { last.me = [lng, lat]; whenReady(applyMe); };
/** 스티커 표시. items = [{id, lng, lat, sticker, kind}] — kind: 'spot' | 'stamp' | 'store' | 'stamped' */
window.setSpots = (items) => { last.spots = items; whenReady(drawSpots); };
/**
 * 지도 꾸미기. items = [{id, lng, lat, sticker?, text?, size}]
 * editing = true면 눌러서 고르고 끌어서 옮길 수 있다. selected = 고른 것의 id
 */
/** 스티커 붙일 자리 표시 (lng가 null이면 지움) */
let pickMarker = null;
window.setPick = (lng, lat) => whenReady(() => {
  if (pickMarker) pickMarker.remove();
  pickMarker = null;
  if (lng == null) return;
  const el = document.createElement('div');
  el.className = 'pick';
  const ring = document.createElement('div');
  ring.textContent = '+';
  el.appendChild(ring);
  pickMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lng, lat]).addTo(map);
});
window.setDecos = (items, editing, selected) => { last.decos = [items, editing, selected]; whenReady(drawDecos); };

/**
 * 스티커를 도장처럼 "콩" 찍는다. fly = true면 화면 위쪽에서 날아와서 붙는다 (친구에게 받은 스티커).
 * 붙는 순간 {"type":"stamped", id}를 보낸다 (Flutter가 폰을 톡 떨게 함).
 */
window.stamp = (id, fly) => whenReady(() => {
  const m = spotMarkers.find((x) => x._gid === id);
  if (!m) return;
  const el = m.getElement(), img = el.querySelector('img');
  if (!img || !img.animate) return;
  let landAt;
  if (fly) {
    const p = map.project(m.getLngLat()), W = map.getContainer().clientWidth;
    const dy = -(p.y + 140), dx = (W * 0.85 - p.x);
    img.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(1.9) rotate(-30deg)`, offset: 0 },
      { transform: `translate(${dx * 0.35}px, ${dy * 0.55}px) scale(1.7) rotate(160deg)`, offset: 0.45 },
      { transform: 'translate(0, -36px) scale(1.5) rotate(350deg)', offset: 0.78 },
      { transform: 'translate(0, 0) scale(1.3, 0.72) rotate(360deg)', offset: 0.88 },
      { transform: 'scale(0.9, 1.12) rotate(360deg)', offset: 0.95 },
      { transform: 'none', offset: 1 },
    ], { duration: 1300, easing: 'cubic-bezier(.45,.05,.55,.95)' });
    landAt = 1140;
  } else {
    img.animate([
      { transform: 'translateY(-46px) scale(2.3)', opacity: 0 },
      { transform: 'translateY(0) scale(1.32, 0.7)', opacity: 1, offset: 0.55 },
      { transform: 'scale(0.9, 1.12)', offset: 0.75 },
      { transform: 'none' },
    ], { duration: 650, easing: 'cubic-bezier(.3,0,.4,1)' });
    landAt = 360;
  }
  setTimeout(() => { kongBurst(el); post({ type: 'stamped', id }); }, landAt);
});

// 붙는 순간: 퍼지는 동그라미 + 튀는 점 + "콩!"
function kongBurst(el) {
  const add = (cls, text) => { const d = document.createElement('div'); d.className = 'kong ' + cls; if (text) d.textContent = text; el.appendChild(d); return d; };
  const ring = add('kong-ring');
  ring.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(6)', opacity: 0 }], { duration: 480, easing: 'ease-out' }).onfinish = () => ring.remove();
  for (let k = 0; k < 6; k++) {
    const a = k / 6 * Math.PI * 2 + 0.3, dot = add('kong-dot');
    dot.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * 34}px, ${Math.sin(a) * 20 - 6}px) scale(.4)`, opacity: 0 }],
      { duration: 520, easing: 'ease-out' }).onfinish = () => dot.remove();
  }
  const t = add('kong-text', '콩!');
  t.animate([{ transform: 'translate(-50%, 6px) scale(.6)', opacity: 0 }, { transform: 'translate(-50%, -12px) scale(1.15)', opacity: 1, offset: 0.3 },
    { transform: 'translate(-50%, -26px) scale(1)', opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => t.remove();
}

// ───────── 지도 만들기 / 테마 바꾸기 ─────────
let theme = null, kit = null, booted = false, starting = false, makeToken = 0;

async function makeMap(id) {
  const t = THEMES[id] || THEMES.pastel;
  const token = ++makeToken;
  ready = false;
  await loadFont(t.font);
  if (token !== makeToken) return; // 그 사이에 다른 테마를 골랐다
  let center = [127.0140, 37.2826], zoom = 16.3;
  if (map) {
    const c = map.getCenter(); center = [c.lng, c.lat]; zoom = map.getZoom();
    if (kit) kit.dispose();
    kit = null; spotMarkers = []; decoMarkers = []; pickMarker = null;
    map.remove(); map = null; fogCanvas = null; fogCtx = null;
  }
  theme = t;
  FOG_COLOR = t.fog || FOG_DEFAULT;
  const box = document.getElementById('map');
    document.body.style.background = box.style.background = t.bg || '#FFF9ED';
  const images = t.images();
  const R = Object.assign({}, ROUTE, t.route || {});
  const opts = {
    container: 'map', style: buildStyle(t), center, zoom,
    localIdeographFontFamily: "'" + t.font + "', sans-serif",
    attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false,
  };
  if (t.pixelRatio) opts.pixelRatio = t.pixelRatio;
  const m = (map = new maplibregl.Map(opts));
  m.touchZoomRotate.disableRotation();
  m.on('styleimagemissing', (e) => { if (!m.hasImage(e.id) && images[e.id]) m.addImage(e.id, images[e.id]); });
  m.once('load', () => {
    if (map !== m) return;
    m.addSource('oldpaths', { type: 'geojson', data: EMPTY });
    m.addSource('path', { type: 'geojson', data: EMPTY });
    m.addSource('me', { type: 'geojson', data: EMPTY });
    setupFogCanvas();
    m.addLayer({ id: 'oldpaths', type: 'line', source: 'oldpaths', layout: round, paint: { 'line-color': R.old, 'line-width': 4, 'line-opacity': 0.7 } });
    m.addLayer({ id: 'route-casing', type: 'line', source: 'path', layout: round, paint: { 'line-color': R.casing, 'line-width': 9 } });
    // 지도 스타일에 오솔길 층 'path'가 있어서 내 경로 층은 route라고 부른다 (같은 이름이면 경로가 안 그려짐)
    m.addLayer({ id: 'route', type: 'line', source: 'path', layout: round, paint: { 'line-color': R.line, 'line-width': 5 } });
    m.addLayer({ id: 'me-halo', type: 'circle', source: 'me', paint: { 'circle-radius': 18, 'circle-color': R.me, 'circle-opacity': 0.2 } });
    m.addLayer({ id: 'me', type: 'circle', source: 'me', paint: { 'circle-radius': 8, 'circle-color': R.me, 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 3 } });
    kit = overlayKit();
    if (t.decorate) { try { t.decorate(kit); } catch (e) {} }
    applyPath(); applyOld(); applyMe(); drawSpots(); drawDecos();
    ready = true;
    renderFog();
    queue.splice(0).forEach((fn) => fn());
    if (!booted) { booted = true; post({ type: 'ready' }); }
  });
  m.on('move', renderFog);
  m.on('click', (e) => setTimeout(() => { if (Date.now() - decoTouchedAt > 400) post({ type: 'mapTap', lat: e.lngLat.lat, lng: e.lngLat.lng }); }, 60));
  m.on('resize', resizeFog);
  m.on('moveend', () => {
    const c = m.getCenter();
    post({ type: 'move', lat: c.lat, lng: c.lng, zoom: m.getZoom() });
  });
}

/** 처음 한 번: Flutter가 고른 테마로 지도를 만든다 */
window.boot = (id) => { if (starting) return window.setTheme(id); starting = true; makeMap(id); };
/** 테마 바꾸기 (지도를 새로 그리고, 안개·경로·스티커·꾸미기는 그대로 다시 올린다) */
window.setTheme = (id) => {
  if (!starting) return window.boot(id);
  if (THEMES[id] && THEMES[id] === theme) return;
  makeMap(id);
};
window.themeIds = () => Object.keys(THEMES);
// Flutter가 boot를 부르지 못한 경우(브라우저 미리보기 등)에는 주소의 ?theme= 또는 기본 테마로 시작
setTimeout(() => { if (!starting) window.boot(new URLSearchParams(location.search).get('theme') || 'pastel'); }, 3000);

// ── 미리보기: 주소 끝에 ?demo=walk 를 붙이면 골목을 걷는 흉내를 내며 안개를 걷는다 (앱에서는 쓰지 않음) ──
if (new URLSearchParams(location.search).get('demo') === 'walk') {
  const cellsAround = (lat, lng, radius) => {
    const ci = Math.floor(lat / D_LAT), cj = Math.floor(lng / D_LNG), n = Math.ceil(radius / CELL_M) + 1, out = [];
    for (let di = -n; di <= n; di++) for (let dj = -n; dj <= n; dj++) {
      const dy = ((ci + di + 0.5) * D_LAT - lat) * M_PER_DEG_LAT;
      const dx = ((cj + dj + 0.5) * D_LNG - lng) * M_PER_DEG_LAT * Math.cos(lat * Math.PI / 180);
      if ((di === 0 && dj === 0) || Math.hypot(dx, dy) <= radius - CELL_M / 2) out.push((ci + di) + ':' + (cj + dj));
    }
    return out;
  };
  whenReady(() => {
    let lat = 37.2826, lng = 127.0140, heading = 0.6;
    const path = [[lng, lat]];
    const step = () => {
      heading += (Math.random() - 0.5) * 0.8;
      lat += Math.cos(heading) * 12 / M_PER_DEG_LAT;
      lng += Math.sin(heading) * 12 / (M_PER_DEG_LAT * Math.cos(lat * Math.PI / 180));
      path.push([lng, lat]);
      window.addExplored(cellsAround(lat, lng, 40));
      window.setPath(path.slice());
      window.setMe(lng, lat);
      if (path.length % 15 === 0) map.easeTo({ center: [lng, lat], duration: 800 });
    };
    window.addExplored(cellsAround(lat, lng, 40));
    window.setMe(lng, lat);
    for (let k = 0; k < 40; k++) step();
    setInterval(step, 400);
  });
}
</script>
