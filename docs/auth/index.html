<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목대장 이메일 인증</title>
<link rel="icon" href="../design/img/a00.webp">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #FFF9ED; color: #24322C; font-family: 'Noto Sans KR', sans-serif; text-align: center; word-break: keep-all; }
  main { max-width: 380px; width: 100%; }
  .badge { width: 160px; height: 160px; margin: 0 auto 20px; border-radius: 50%; background: #FDE7D3; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(36,50,44,.12); display: flex; align-items: center; justify-content: center; }
  .badge img { width: 130px; height: 130px; object-fit: contain; }
  h1 { margin: 0 0 10px; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; color: #0E5A3C; }
  p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #5E6A63; }
  .card { margin-top: 20px; padding: 16px; border-radius: 18px; background: #fff; box-shadow: 0 4px 12px rgba(36,50,44,.08); font-size: 14px; line-height: 1.7; text-align: left; }
  .card b { color: #0E5A3C; }
  .error h1 { color: #B3263A; }
</style>
</head>
<body>
<main id="ok">
  <div class="badge"><img src="../design/img/a04.webp" alt="응원하는 고양이"></div>
  <h1>이메일 인증 완료!</h1>
  <p>골목대장 계정이 준비됐어요.</p>
  <div class="card">
    1. 이 창을 닫고 <b>골목대장 앱</b>으로 돌아가요<br>
    2. <b>이메일로 계속하기 → 로그인</b>을 눌러요<br>
    3. 가입할 때 쓴 이메일과 비밀번호를 넣으면 시작!
  </div>
</main>
<main id="err" class="error" hidden>
  <div class="badge"><img src="../design/img/a21.webp" alt="낮잠 자는 고양이"></div>
  <h1>링크가 만료됐어요</h1>
  <p>인증 링크는 한 번만, 정해진 시간 안에만 쓸 수 있어요.</p>
  <div class="card">앱에서 <b>이메일로 계속하기 → 가입하기</b>를 다시 눌러 새 인증 메일을 받아 주세요.</div>
</main>
<script>
  // Supabase가 오류를 주소 뒤(#error=...)에 붙여 보낸다
  const h = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
  if (h.get('error') || h.get('error_code')) {
    document.getElementById('ok').hidden = true;
    document.getElementById('err').hidden = false;
  }
</script>
</body>
</html>
