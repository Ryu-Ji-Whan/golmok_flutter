<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>친구에게 스티커 보내기</title>
<style>
  .stage { height: 220px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .prev { position: relative; width: 160px; height: 140px; }
  .photo { position: absolute; left: 0; top: 6px; width: 112px; height: 112px; background: #fff; padding: 6px; border-radius: 10px; box-shadow: var(--shadow); transform: rotate(-5deg); }
  .photo div { width: 100%; height: 100%; border-radius: 6px; background: linear-gradient(160deg, #F7C88A, #E98F6B 55%, #8C6C9E); }
  .prev img { position: absolute; right: 0; bottom: 0; width: 88px; }
  .fly { animation: fly 1.1s cubic-bezier(.55,0,.8,.4) forwards; }
  @keyframes fly { to { transform: translate(230px, -330px) rotate(95deg) scale(.4); opacity: 0; } }
  .whoosh { position: absolute; bottom: 20px; font-family: 'Jua'; font-size: 30px; color: var(--orangeText); opacity: 0; }
  .whoosh.go { animation: whoosh 1s ease-out forwards; }
  @keyframes whoosh { 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px); } }
  .done { display: none; text-align: center; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back">‹</button><h1>친구에게 스티커 보내기</h1></div>
<div class="stage">
  <div id="prev"><div class="prev"><div class="photo"><div></div></div><img src="../img/c13.webp" alt=""></div>
    <div class="jua" style="font-size:24px;color:var(--forest);text-align:center;margin-top:6px">노을 맛집 계단</div></div>
  <div class="whoosh" id="whoosh">슝~</div>
  <div class="done" id="done"><img src="../img/a04.webp" alt="" style="width:110px"><div class="jua" style="font-size:24px;color:var(--forest)">골목참새님에게 보냈어요!</div></div>
</div>
<div id="pick">
  <p class="sub" style="padding:0 20px 8px;font-size:13px;line-height:1.5">누구에게 보낼까요? 이 기록의 정확한 위치와 사진이 함께 가요. 걸은 길은 가지 않아요.</p>
  <div style="padding:0 16px">
    <div class="pick-row on"><div class="av"><img src="../img/c01.webp" alt=""></div><div class="grow name">골목참새</div><span class="radio"></span></div>
    <div class="pick-row"><div class="av"><img src="../img/a00.webp" alt=""></div><div class="grow name">고양이집사</div><span class="radio"></span></div>
    <div class="pick-row"><div class="av"><img src="../img/a21.webp" alt=""></div><div class="grow name">노을사냥꾼</div><span class="radio"></span></div>
  </div>
  <div class="bottom"><button class="btn orange" onclick="send()">➤ 골목참새님에게 보내기</button></div>
</div>
<div id="after" style="display:none">
  <p class="sub" style="text-align:center;padding:0 24px;font-size:14px;line-height:1.7">친구가 "받기"를 누르면 친구 지도의 이 자리에 스티커가 콩 붙어요.<br>받은 스티커는 그때부터 친구의 것이 돼요.</p>
  <div class="bottom"><button class="btn" onclick="location.reload()">확인</button></div>
</div>
<script>
  // 보내기를 누르면 스티커가 슝 날아가고 "보냈어요"로 바뀐다
  function send() {
    document.getElementById('prev').classList.add('fly');
    document.getElementById('whoosh').classList.add('go');
    setTimeout(() => {
      document.getElementById('prev').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      document.getElementById('pick').style.display = 'none';
      document.getElementById('after').style.display = 'block';
    }, 1150);
  }
</script>
</body>
</html>
