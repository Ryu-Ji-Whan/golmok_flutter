<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">

<title>내 지도</title>
<style>
  /* 앱 mymap.dart: 지도 카드 300px + [기록한 장소 | 산책 기록]. 산책을 고르면 그 경로만 지도에 */
  .appbar { padding: 0 8px 0 16px; }
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; }
  .ib { width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
  .ib svg { width: 24px; height: 24px; fill: var(--forest); }
  .mapcard { position: relative; margin: 0 16px; height: 300px; border: 2px solid var(--ink); border-radius: 22px; overflow: hidden; }
  .mapcard .bg { position: absolute; inset: 0; background: url(../img/theme-pastel.jpg) 30% 60% / 460px auto no-repeat; }
  .mapcard svg.layer { position: absolute; inset: 0; }
  .mk { position: absolute; width: 40px; height: 40px; transform: translate(-50%, -100%); filter: drop-shadow(2px 2px 0 #24322C); }
  .clear { position: absolute; top: 8px; right: 8px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 500; }
  .clear svg { width: 16px; height: 16px; fill: var(--forest); }
  .seg { margin: 14px 16px 6px; display: flex; height: 40px; border: 1px solid #7C8580; border-radius: 20px; overflow: hidden; }
  .seg a { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; cursor: pointer; }
  .seg a + a { border-left: 1px solid #7C8580; }
  .seg a.on { background: var(--mint); color: var(--forest); font-weight: 700; }
  .list { padding: 8px 16px 0; height: 300px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 8px; }
  .item.on { background: var(--mint); }
  .thumb { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .t { font-size: 15px; font-weight: 700; }
  .pill.dark { background: var(--forest); color: #fff; }
  .sp { padding: 12px; }
  .sp .box { width: 56px; height: 56px; border-radius: 14px; background: var(--cream); display: flex; align-items: center; justify-content: center; flex: none; }
  .sp .box img { width: 46px; height: 46px; object-fit: contain; }
  .chev { width: 24px; height: 24px; fill: var(--muted); flex: none; }
  .on .chev { fill: var(--forest); }
  .photo { width: 20px; height: 20px; fill: var(--leaf); flex: none; }
  #spots { display: none; }
</style>
</head>
<body class="has-tabbar">
<div class="status"><span>9:41</span><i></i></div>

  <svg class="layer" viewBox="0 0 354 296" aria-hidden="true">

    <rect width="354" height="296" fill="rgba(112,120,114,.55)" mask="url(#m)"/>

  <div class="clear" id="clear"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>경로 지우기</div>
</div>

<div class="seg"><a id="tabSpots" onclick="view(0)">기록한 장소 12</a><a id="tabWalks" class="on" onclick="view(1)">산책 기록 7</a></div>

<div class="list" id="walks">
  <div class="item on"><svg class="thumb" viewBox="0 0 56 56"><rect width="56" height="56" fill="#E4F2E8"/><g stroke="#fff" stroke-width="2.5"><path d="M14 0v56M28 0v56M42 0v56M0 14h56M0 28h56M0 42h56"/></g><polyline points="11,40 20,33 24,24 31,21 38,28 45,14" fill="none" stroke="#24322C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="11,40 20,33 24,24 31,21 38,28 45,14" fill="none" stroke="#F39A45" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="40" r="3" fill="#2F8A61" stroke="#24322C" stroke-width="1.5"/><circle cx="45" cy="14" r="3" fill="#F39A45" stroke="#24322C" stroke-width="1.5"/></svg>
    <div class="grow"><div class="t">2026.11.26 산책</div><div class="sub">1.8km · 32분</div></div><span class="pill dark">지도에 보는 중</span></div>
  <div class="item"><svg class="thumb" viewBox="0 0 56 56"><rect width="56" height="56" fill="#E4F2E8"/><g stroke="#fff" stroke-width="2.5"><path d="M14 0v56M28 0v56M42 0v56M0 14h56M0 28h56M0 42h56"/></g><polyline points="12,14 22,20 30,16 40,26 36,38 44,44" fill="none" stroke="#24322C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="12,14 22,20 30,16 40,26 36,38 44,44" fill="none" stroke="#F39A45" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="14" r="3" fill="#2F8A61" stroke="#24322C" stroke-width="1.5"/><circle cx="44" cy="44" r="3" fill="#F39A45" stroke="#24322C" stroke-width="1.5"/></svg>

  <div class="item"><svg class="thumb" viewBox="0 0 56 56"><rect width="56" height="56" fill="#E4F2E8"/><g stroke="#fff" stroke-width="2.5"><path d="M14 0v56M28 0v56M42 0v56M0 14h56M0 28h56M0 42h56"/></g><polyline points="14,30 20,18 34,14 42,24 38,40 22,42 14,30" fill="none" stroke="#24322C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14,30 20,18 34,14 42,24 38,40 22,42 14,30" fill="none" stroke="#F39A45" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="30" r="3" fill="#F39A45" stroke="#24322C" stroke-width="1.5"/></svg>

<nav class="tabbar" data-on="map"></nav>
<script src="tabbar.js"></script>
<script>
  // 밝힌 골목 → 안개 구멍, 고른 산책(11.26) 경로만 주황 선
  const walk = [[30, 250], [92, 214], [128, 160], [180, 140], [228, 160], [262, 96], [300, 40]];
  const lines = [walk, [[180, 140], [150, 60], [110, 0]], [[228, 160], [300, 200], [335, 245], [354, 260]], [[300, 200], [265, 245]]];
  let h = '', k = 0;
  lines.forEach((pts) => { for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], n = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 8);
    for (let s = 0; s <= n; s++) { k++; const t = s / n; h += `<circle cx="${(x1 + (x2 - x1) * t + Math.sin(k * 2.1) * 5).toFixed(1)}" cy="${(y1 + (y2 - y1) * t + Math.cos(k * 1.7) * 5).toFixed(1)}" r="${(26 + Math.sin(k * 3.3) * 4).toFixed(1)}"/>`; }
  } });
  document.getElementById('holes').innerHTML = h;
  const pts = walk.map((p) => p.join(',')).join(' ');
  const route = `<polyline points="${pts}" stroke="#24322C" stroke-width="9"/><polyline points="${pts}" stroke="#F39A45" stroke-width="5"/>`;
  // 시안: 탭을 누르면 두 목록을 오간다 (장소 목록일 땐 경로 없이 고른 자리 근처)
  function view(v) {
    document.getElementById('walks').style.display = v ? 'block' : 'none';
    document.getElementById('spots').style.display = v ? 'none' : 'block';
    document.getElementById('tabWalks').className = v ? 'on' : '';
    document.getElementById('tabSpots').className = v ? '' : 'on';
    document.getElementById('route').innerHTML = v ? route : '';
    document.getElementById('clear').style.display = v ? 'flex' : 'none';
  }
  view(new URLSearchParams(location.search).get('v') === 'spots' ? 0 : 1);
</script>
