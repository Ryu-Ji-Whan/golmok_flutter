<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>가입 완료</title>
<style>
  /* 앱 signup.dart DoneScreen: 환영 인사 + 환영 팩(깃발 참새·도토리·카메라) + 첫 산책 시작하기 */
  .wrap { position: absolute; top: 47px; bottom: 0; left: 24px; right: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .av { width: 132px; height: 132px; border: 4px solid #fff; box-shadow: var(--shadow); }
  .av img { width: 112px; height: 112px; }
  .pack { display: flex; gap: 8px; margin-top: 10px; }
  .pack div { flex: 1; height: 72px; border-radius: 14px; background: var(--cream); display: flex; align-items: center; justify-content: center; }
  .pack img { width: 52px; height: 52px; object-fit: contain; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="wrap">
  <div style="flex:1"></div>
  <div class="av"><img src="../img/a02.webp" alt=""></div>
  <h2 class="jua" style="font-size:28px;color:var(--forest);margin-top:14px">골목냥이님, 환영해요!</h2>
  <p style="font-size:15px;color:var(--muted);line-height:1.5;margin-top:8px">골목대장이 될 준비 끝!<br>첫 산책에서 골목을 밝혀 보세요</p>
  <div class="card" style="width:100%;margin-top:20px">
    <div class="row"><b style="flex:1;text-align:left;font-size:14px">환영 스티커 팩이 도착했어요</b><span class="pill">보관함 +3</span></div>
    <div class="pack"><div><img src="../img/c13.webp" alt=""></div><div><img src="../img/a20.webp" alt=""></div><div><img src="../img/a17.webp" alt=""></div></div>
  </div>
  <p style="font-size:13px;color:var(--muted);margin-top:12px">내 동네 · 수원시 팔달구 행궁동</p>
  <div style="flex:1"></div>
  <button class="btn" style="margin-bottom:28px">첫 산책 시작하기</button>
</div>
</body>
</html>
