<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>꾸미기 그만하기</title>
<style>
  /* 앱 photo_edit.dart: 스티커를 붙인 채 닫기(✕)·뒤로를 누르면 묻는 창 (ui.dart confirm) */
  body { background: #1F2623; color: #fff; }
  .status i { border-color: #fff; } .status i::after { background: #fff; }
  .bar { height: 56px; display: flex; align-items: center; padding: 0 8px 0 4px; }
  .bar .x { width: 48px; height: 48px; border: 0; background: none; color: #fff; font-size: 24px; }
  .bar h1 { flex: 1; font-family: 'Jua'; font-weight: 400; font-size: 22px; text-align: center; }
  .bar .ok { border: 0; background: none; font-family: 'Jua'; font-size: 20px; color: var(--orange); padding: 8px 12px; }
  .stage { height: 360px; padding: 4px 16px 12px; display: flex; justify-content: center; }
  .canvas { position: relative; height: 100%; aspect-ratio: 288 / 354; border-radius: 18px; overflow: hidden; background: url(../img/bench.jpg) center / cover; }
  .canvas .st { position: absolute; object-fit: contain; }
  .sel { outline: 2px dashed #fff; outline-offset: 2px; border-radius: 6px; }
  .stamp { position: absolute; left: 10px; bottom: 14px; display: flex; align-items: center; gap: 4px; padding: 4px 12px 4px 8px; border-radius: 999px; background: rgba(255,249,237,.95); white-space: nowrap; transform: scale(.82); transform-origin: 0 100%; }
  .stamp img { width: 28px; height: 28px; object-fit: contain; }
  .stamp b { font-family: 'Jua'; font-weight: 400; font-size: 18px; color: #0E5A3C; margin-right: 6px; }
  .stamp span { font-size: 14px; font-weight: 600; color: #24322C; }
  .tools { display: flex; gap: 8px; padding: 0 16px; overflow: hidden; }
  .tools span { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; background: #353D39; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cream); color: var(--ink); border-radius: 28px 28px 0 0; padding: 14px 16px 30px; }
  .chips { display: flex; gap: 8px; overflow: hidden; }
  .chips span { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; font-size: 14px; font-weight: 700; }
  .chips .date { background: var(--orange); border-color: var(--orange); color: #fff; }
  .chips .on { background: var(--forest); border-color: var(--forest); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 12px; height: 132px; overflow: hidden; }
  .grid div { aspect-ratio: 1; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .grid img { width: 80%; height: 80%; object-fit: contain; }
  .two { display: flex; gap: 10px; }
  .two .btn { height: 50px; font-size: 15px; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 5; } .dlg { position: absolute; left: 40px; right: 40px; top: 320px; z-index: 6; background: #fff; color: var(--ink); border-radius: 22px; padding: 24px 24px 14px; } .dlg h3 { font-size: 18px; font-weight: 700; } .dlg p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 14px; } .dlg .acts { display: flex; justify-content: flex-end; gap: 4px; margin-top: 18px; } .dlg button { border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--muted); padding: 10px 12px; } .dlg .danger { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="bar"><button class="x" aria-label="닫기">✕</button><h1>사진 꾸미기</h1><button class="ok">완료</button></div>
<div class="stage"><div class="canvas">
  <img class="st" src="../img/c13.webp" alt="" style="left:14px;top:20px;width:86px;height:86px">
  <img class="st sel" src="../img/a21.webp" alt="" style="right:22px;top:130px;width:110px;height:110px">
  <div class="stamp"><img src="../img/a02.webp" alt=""><b>골목대장</b><span>행궁동 · 2026.11.19</span></div>
</div></div>
<div class="tools"><span>− 작게</span><span>＋ 크게</span><span>↻ 회전</span><span>⧉ 맨 앞</span><span style="color:#F4A3B4">🗑 삭제</span></div>
<div class="sheet">
  <div class="chips"><span class="date">📅 날짜 도장</span><span class="on">전체</span><span>고양이</span><span>참새</span><span>소품</span><span>장소</span></div>
  <div class="grid">
    <div><img src="../img/a00.webp" alt=""></div><div><img src="../img/a01.webp" alt=""></div><div><img src="../img/a02.webp" alt=""></div><div><img src="../img/a04.webp" alt=""></div><div><img src="../img/a11.webp" alt=""></div>
    <div><img src="../img/a13.webp" alt=""></div><div><img src="../img/a14.webp" alt=""></div><div><img src="../img/a15.webp" alt=""></div><div><img src="../img/a17.webp" alt=""></div><div><img src="../img/a18.webp" alt=""></div>
  </div>
  <div class="two"><button class="btn outline">⤓ 갤러리에 저장</button><button class="btn">⇪ SNS에 공유</button></div>
</div>
<div class="scrim"></div><div class="dlg"><h3>꾸미기를 그만할까요?</h3><p>붙인 스티커는 저장되지 않아요.</p><div class="acts"><button>취소</button><button class="danger">그만하기</button></div></div>
</body>
</html>
