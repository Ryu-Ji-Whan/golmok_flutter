<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>스티커 상점</title>
<style>
  /* 앱 shop.dart: 스티커 팩 목록. 결제 없음(데모로 받기), 동네 대장 한정은 동네 탭에서 받는다 */
  .appbar { padding: 0 16px; }
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; }
  .scroll { height: calc(844px - 47px - 56px - 84px); overflow: hidden; padding: 0 16px; }
  .pack { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 10px; }
  .pk { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .fb { height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: var(--forest); color: #fff; font-size: 14px; font-weight: 700; margin-left: 8px; flex: none; }
  .fb.off { background: var(--sand); color: var(--muted); }
  .sts { display: flex; gap: 6px; margin-top: 10px; overflow: hidden; height: 52px; }
  .sts img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .sts img.no { opacity: .35; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><h1>스티커 상점</h1><span class="pill">보관함 15/55</span></div>
<div class="scroll">
  <div class="sec">스티커 팩</div>
  <div id="packs"></div>
  <p class="sub" style="text-align:center;margin-top:8px">데모 버전이라 결제 없이 받을 수 있어요.</p>
</div>
<nav class="tabbar" data-on="shop"></nav>
<script src="tabbar.js"></script>
<script>
  // lib/data/content.dart 의 packs 와 같은 순서·이름
  const owned = new Set(['a00', 'a01', 'a02', 'a04', 'a21', 'c01', 'a11', 'a13', 'a14', 'a15', 'a18', 'a19', 'c13', 'a20', 'a17']);
  const packs = [
    ['가을 골목 팩', '스티커 8종', 'paid', ['a12', 'b04', 'b05', 'b06', 'b07', 'b08', 'b09', 'b10']],
    ['동네 대장 한정', '동네 리더보드 3위 안에 들기', 'reward', ['b11', 'b12']],
    ['참새 친구 팩', '스티커 6종', 'paid', ['a05', 'a06', 'a07', 'a08', 'a09', 'a10']],
    ['골목 고양이 팩', '스티커 4종', 'paid', ['a03', 'c02', 'c03', 'c05']],
    ['기본 팩', '처음부터 가진 스티커', 'starter', ['a00', 'a01', 'a02', 'a04', 'a21', 'c01', 'a11', 'a13', 'a14', 'a15', 'a18', 'a19']],
    ['환영 팩', '가입 선물', 'starter', ['c13', 'a20', 'a17']],
  ];
  // 앱과 같은 순서: 기본 → 환영 → 가을 → 참새 → 고양이 → 대장
  const order = [4, 5, 0, 2, 3, 1];
  document.getElementById('packs').innerHTML = order.map((i) => {
    const [name, desc, kind, ids] = packs[i];
    const have = ids.filter((x) => owned.has(x)).length, all = have === ids.length;
    const label = kind === 'reward' ? '동네 탭에서 받기' : all ? '보유 중' : kind === 'starter' ? '가입 선물' : '데모로 받기';
    const off = kind === 'reward' || all;
    return `<div class="pack"><div class="row" style="gap:0"><div class="grow"><div class="pk">${name}${kind === 'reward' ? '<span class="pill" style="background:var(--peach);color:var(--orangeText)">한정</span>' : ''}</div>` +
      `<div class="sub">${desc}</div></div><span class="sub">${have}/${ids.length}</span><button class="fb${off ? ' off' : ''}">${label}</button></div>` +
      `<div class="sts">${ids.map((x) => `<img src="../img/${x}.webp" alt=""${owned.has(x) ? '' : ' class="no"'}>`).join('')}</div></div>`;
  }).join('');
</script>
</body>
</html>
