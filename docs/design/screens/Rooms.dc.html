<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>친구 방</title>
<style>
  /* 앱 town.dart + rooms.dart(RoomsPane): 동네 탭의 "친구 방". 방 만들기·코드로 들어가기, 초대 받은 방, 내 방 목록 */
  .appbar { padding: 0 16px; }
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; }
  .tabs { display: flex; height: 48px; border-bottom: 1px solid var(--lineSoft); }
  .tabs a { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--muted); text-decoration: none; position: relative; }
  .tabs a.on { color: var(--forest); }
  .tabs a.on::after { content: ''; position: absolute; bottom: -1px; left: 50%; width: 56px; margin-left: -28px; height: 3px; border-radius: 3px 3px 0 0; background: var(--forest); }
  .scroll { height: calc(844px - 47px - 56px - 49px - 84px); overflow: hidden; padding: 12px 16px 0; }
  .two { display: flex; gap: 10px; }
  .two .btn { flex: 1; font-size: 15px; }
  .two svg { width: 22px; height: 22px; fill: currentColor; }
  .invite { background: var(--mint); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; margin: 16px 0 10px; }
  .invite .two .btn { height: 56px; }
  .room { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; text-decoration: none; color: inherit; }
  .ric { width: 48px; height: 48px; border-radius: 14px; background: var(--mint); display: flex; align-items: center; justify-content: center; flex: none; }
  .ric svg { width: 24px; height: 24px; fill: var(--forest); }
  .chev { width: 24px; height: 24px; fill: var(--muted); flex: none; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><h1>동네</h1></div>
<div class="tabs"><a class="on">친구 방</a><a href="Leaderboard.dc.html">리더보드</a></div>
<div class="scroll">
  <div class="two">
    <button class="btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>방 만들기</button>
    <button class="btn outline"><svg viewBox="0 0 24 24"><path d="M22 19h-6v-4h-2.68c-1.14 2.42-3.6 4-6.32 4-3.86 0-7-3.14-7-7s3.14-7 7-7c2.72 0 5.17 1.58 6.32 4H24v6h-2v4zm-4-2h2v-4h2v-2H11.94l-.23-.67C11.01 8.34 9.11 7 7 7c-2.76 0-5 2.24-5 5s2.24 5 5 5c2.11 0 4.01-1.34 4.71-3.33l.23-.67H18v4zM7 15c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>코드로 들어가기</button>
  </div>

  <div class="invite">
    <div style="font-size:12px;color:var(--forest)">노을사냥꾼님이 방에 초대했어요</div>
    <div style="font-size:16px;font-weight:700;margin-top:2px">퇴근길 산책 모임</div>
    <div class="sub">들어가면 방 사람들에게 내 오늘 경로가 보여요 (방에서 숨길 수 있어요)</div>
    <div class="two" style="margin-top:10px"><button class="btn outline">거절</button><button class="btn">들어가기</button></div>
  </div>

  <a class="room" href="Room.dc.html"><span class="ric"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>
    <div class="grow"><div class="name">우리 동네 산책단</div><div class="sub" style="margin-top:2px">3명 · 내가 만든 방</div></div><svg class="chev" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></a>
  <a class="room" href="Room.dc.html"><span class="ric"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>
    <div class="grow"><div class="name">고양이 골목 탐험대</div><div class="sub" style="margin-top:2px">5명 · 내 경로 숨김</div></div><svg class="chev" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></a>

  <p class="sub" style="text-align:center;line-height:1.5;margin-top:8px">방 사람끼리만 서로의 오늘 걸은 길과 방에 올린 스티커가 보여요. 밤 12시가 지나면 경로는 사라지고, 방마다 내 경로를 숨길 수도 있어요. 한 방에 최대 10명.</p>
</div>
<nav class="tabbar" data-on="town"></nav>
<script src="tabbar.js"></script>
</body>
</html>
