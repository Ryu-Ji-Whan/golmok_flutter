<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>골목 피드</title>
<style>
  /* 앱 feed.dart: "<동네> 골목 피드". 이웃이 공유한 스티커 기록 카드 (좌표·경로 없음), 좋아요 */
  .appbar { padding: 0 16px; }
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; }
  .scroll { height: calc(844px - 47px - 56px - 84px); overflow: hidden; padding: 4px 16px 0; }
  .post { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .post .av { width: 40px; height: 40px; }
  .art { height: 150px; border-radius: 18px; background: var(--cream); display: flex; align-items: center; justify-content: center; margin: 12px 0 10px; }
  .art img { width: 120px; height: 120px; object-fit: contain; }
  .tt { font-size: 16px; font-weight: 700; }
  .memo { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .acts { display: flex; align-items: center; margin-top: 6px; font-size: 14px; }
  .like { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 12px 8px 4px; font-size: 14px; color: var(--ink); }
  .acts svg { width: 20px; height: 20px; }
  .cmt { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .cmt svg { width: 18px; height: 18px; fill: var(--muted); }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><h1>행궁동 골목 피드</h1></div>

    <div class="acts">
      <button class="like" onclick="this.classList.toggle('on');this.querySelector('path').setAttribute('d', this.classList.contains('on') ? H1 : H0);this.querySelector('span').textContent = this.classList.contains('on') ? 1 : 0"><svg viewBox="0 0 24 24" fill="#EE7C8B"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>1</span></button>
      <span class="cmt"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>0</span>
    </div>
  </div>
  <div class="post">
    <div class="row" style="gap:10px"><div class="av"><img src="../img/a21.webp" alt=""></div><div class="grow"><div class="name">노을사냥꾼</div><div class="sub">행궁동 · 어제</div></div></div>
    <div class="art"><img src="../img/c04.webp" alt=""></div>
    <div class="tt">계단 위 노을 명당</div>

    <div class="acts">
      <button class="like"><svg viewBox="0 0 24 24" fill="#EE7C8B"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg><span>0</span></button>
      <span class="cmt"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>0</span>
    </div>
  </div>
  <p class="sub" style="text-align:center">당겨서 새로고침할 수 있어요</p>
</div>
