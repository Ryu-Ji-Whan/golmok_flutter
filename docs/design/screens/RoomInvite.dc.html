<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>방에 친구 초대</title>
<style>
  /* 앱 rooms.dart _InviteSheet: 방 화면에서 친구 초대 아이콘 → 아래 시트(화면 65%). 초대 코드 + 코드 보내기 + 골목대장 친구 바로 초대 */
  .behind { position: absolute; inset: 0; width: 390px; height: 844px; border: 0; pointer-events: none; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 549px; background: #FFFDF8; border-radius: 28px 28px 0 0; padding: 0 20px; }
  .handle { width: 32px; height: 4px; border-radius: 2px; background: #7C8580; opacity: .5; margin: 22px auto 22px; }
  .lab { font-size: 13px; color: var(--muted); }
  .code { display: flex; align-items: center; margin: 6px 0 4px; }
  .code b { flex: 1; font-family: 'Jua'; font-weight: 400; font-size: 36px; letter-spacing: 6px; }
  .ib { width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
  .ib svg, .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .ib svg { fill: var(--forest); width: 24px; height: 24px; }
  .fr { display: flex; align-items: center; gap: 16px; height: 64px; }
  .fr .av { width: 40px; height: 40px; }
  .tb { border: 0; background: none; color: var(--forest); font-size: 14px; font-weight: 700; padding: 10px 12px; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 24px; background: var(--ink); color: #fff; border-radius: 10px; padding: 14px 16px; font-size: 14px; display: none; }
</style>
</head>
<body>
<iframe class="behind" src="Room.dc.html" tabindex="-1" aria-hidden="true"></iframe>
<div class="dim"></div>
<div class="sheet">
  <div class="handle"></div>
  <div class="lab">초대 코드</div>
  <div class="code"><b>K7QM2X</b><button class="ib" aria-label="복사" onclick="toast('코드를 복사했어요')"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button></div>
  <button class="btn outline"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>코드 보내기</button>
  <div class="lab" style="margin-top:22px">골목대장 친구 바로 초대</div>
  <div style="margin-top:6px">
    <div class="fr"><div class="av"><img src="../img/c01.webp" alt=""></div><div class="grow name">골목참새</div><span class="pill">초대함</span></div>
    <div class="fr"><div class="av"><img src="../img/a00.webp" alt=""></div><div class="grow name">고양이집사</div><button class="tb" onclick="this.outerHTML='<span class=&quot;pill&quot;>초대함</span>';toast('고양이집사님을 초대했어요')">초대</button></div>
    <div class="fr"><div class="av"><img src="../img/a21.webp" alt=""></div><div class="grow name">노을사냥꾼</div><span class="pill">초대함</span></div>
    <div class="fr"><div class="av"><img src="../img/a04.webp" alt=""></div><div class="grow name">행궁산책러</div><button class="tb" onclick="this.outerHTML='<span class=&quot;pill&quot;>초대함</span>';toast('행궁산책러님을 초대했어요')">초대</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 1800); }
</script>
</body>
</html>
