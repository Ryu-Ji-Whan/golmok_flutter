<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>사진 넣기</title>
<style>
  /* 앱 record.dart "사진 넣기" 바텀시트: 사진 찍기 / 앨범에서 고르기 (사진이 있으면 "사진 빼기"도) */
  .under { position: absolute; inset: 0; width: 390px; height: 844px; border: 0; }
  .scrim { position: absolute; inset: 0; background: rgba(36,50,44,.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; padding: 16px 16px 34px; }
  .sheet h3 { text-align: center; font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .li { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 16px; font-size: 16px; }
  .li span { width: 24px; text-align: center; font-size: 20px; color: var(--forest); }
</style>
</head>
<body>
<iframe class="under" src="Record.dc.html?scroll=420" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
<div class="scrim"></div>
<div class="sheet">
  <h3>사진 넣기</h3>
  <div class="li" onclick="location.href='PhotoPermission.dc.html'"><span>📷</span>사진 찍기</div>
  <div class="li" onclick="location.href='PhotoDone.dc.html'"><span>🖼</span>앨범에서 고르기</div>
</div>
</body>
</html>
