<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>프로필</title>
<style>
  /* 앱 profile.dart: 산책 탭 왼쪽 위 프로필 칩을 누르면 열리는 화면 (따로 열리는 화면이라 아래 탭 줄 없음) */
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; }
  .scroll { height: calc(844px - 47px - 56px); overflow: hidden; padding: 4px 16px 0; }
  .me .av { width: 72px; height: 72px; }
  .nick { font-family: 'Jua'; font-size: 24px; line-height: 1.2; }
  .chg { font-size: 12px; font-weight: 700; color: var(--leaf); }
  .ib { width: 40px; height: 40px; border: 0; background: none; display: flex; align-items: center; justify-content: center; flex: none; }
  .ib svg, .mi svg { width: 24px; height: 24px; }
  .stats { display: flex; justify-content: space-evenly; text-align: center; }
  .stats b { display: block; font-family: 'Jua'; font-weight: 400; font-size: 24px; color: var(--forest); line-height: 1.25; }
  .menu { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px; text-decoration: none; color: inherit; }
  .mi { width: 40px; height: 40px; border-radius: 12px; background: var(--mint); display: flex; align-items: center; justify-content: center; flex: none; fill: var(--forest); }
  .badge { background: var(--orange); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .chev { width: 24px; height: 24px; fill: var(--muted); flex: none; }
  .box { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; }
  .box img { width: 44px; height: 44px; object-fit: contain; }
  .box img.no { opacity: .18; }
  .demo { background: var(--sand); border-radius: 16px; padding: 14px; margin-top: 14px; }
  .ob { height: 56px; width: 100%; border-radius: 28px; border: 1px solid var(--line); background: #fff; color: var(--forest); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; }
  .ob svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back" aria-label="뒤로" onclick="location.href='WalkStart.dc.html'">‹</button><h1>프로필</h1></div>
<div class="scroll">
  <div class="card row me" style="gap:14px">
    <div class="av"><img src="../img/a00.webp" alt=""></div>
    <div class="grow">
      <div class="nick">골목대장</div>
      <div style="padding:4px 0"><span class="sub" style="font-size:13px">경기도 수원시 팔달구 행궁동</span> <span class="chg">바꾸기 ›</span></div>
      <div class="sub">가입 2026.11.16</div>
      <div style="font-size:12px;color:var(--leafText)">카카오 계정 · 서버에 저장 중</div>
    </div>
    <button class="ib" aria-label="닉네임 바꾸기"><svg viewBox="0 0 24 24"><path d="m14.06 9.02.92.92L5.92 19H5v-.92l9.06-9.06M17.66 3c-.25 0-.51.1-.7.29l-1.83 1.83 3.75 3.75 1.83-1.83a.996.996 0 0 0 0-1.41l-2.34-2.34c-.2-.2-.45-.29-.71-.29zm-3.6 3.19L3 17.25V21h3.75L17.81 9.94l-3.75-3.75z"/></svg></button>
  </div>
  <div class="card stats" style="margin-top:12px">
    <div><b>18.6km</b><span class="sub">총 걸은 거리</span></div>
    <div><b>9일</b><span class="sub">산책한 날</span></div>
    <div><b>12곳</b><span class="sub">기록</span></div>
  </div>
  <div style="height:12px"></div>
  <a class="menu" href="Friends.dc.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M16.67 13.13C18.04 14.06 19 15.32 19 17v3h4v-3c0-2.18-3.57-3.47-6.33-3.87zM15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4c-.47 0-.91.1-1.33.24a5.98 5.98 0 0 1 0 7.52c.42.14.86.24 1.33.24zm-6 0c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 7c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4zm6 5H3v-.99C3.2 16.29 6.3 15 9 15s5.8 1.29 6 2v1z"/></svg></span>
    <div class="grow"><div class="name">친구</div><div class="sub">받은 친구 요청 1개</div></div><span class="badge">1</span><svg class="chev" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></a>
  <a class="menu" href="MapTheme.dc.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.47.64 1.06.64 1.67A2.5 2.5 0 0 1 12 22zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5a.54.54 0 0 0-.14-.35c-.41-.46-.63-1.05-.63-1.65a2.5 2.5 0 0 1 2.5-2.5H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z"/><circle cx="6.5" cy="11.5" r="1.5"/><circle cx="9.5" cy="7.5" r="1.5"/><circle cx="14.5" cy="7.5" r="1.5"/><circle cx="17.5" cy="11.5" r="1.5"/></svg></span>
    <div class="grow"><div class="name">지도 테마</div><div class="sub">골목 파스텔</div></div><svg class="chev" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></a>
  <div class="sec">내 스티커 보관함 15/55</div>
  <div class="card box" id="box"></div>
  <div class="demo">
    <div style="font-size:13px;font-weight:700">데모 버전 안내</div>
    <div class="sub" style="margin-top:4px;line-height:1.5">산책 경로, 안개 걷기, 스티커 기록은 이 폰에 저장되고, 카카오·이메일로 로그인하면 내 계정(서버)에도 저장돼요. 스티커 팩 결제는 아직 준비 중이에요.</div>
  </div>
  <button class="ob"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>로그아웃</button>
  <button class="ob" style="margin-top:8px;color:var(--danger)"><svg viewBox="0 0 24 24"><path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/></svg>데모 데이터 초기화</button>
  <p class="sub" style="text-align:center;font-size:11px;margin-top:10px">골목대장 Flutter 데모 v0.1.0</p>
</div>
<script>
  // 보관함: 가진 스티커는 진하게, 아직 없는 건 흐리게 (lib/data/stickers.dart 순서 대략)
  const owned = new Set(['a00', 'a01', 'a02', 'a04', 'a21', 'c01', 'a11', 'a13', 'a14', 'a15', 'a18', 'a19', 'c13', 'a20', 'a17']);
  const all = ['a00', 'a01', 'a02', 'a03', 'a04', 'a05', 'a06', 'a07', 'a08', 'a09', 'a10', 'a11', 'a12', 'a13', 'a14', 'a15', 'a17', 'a18', 'a19', 'a20', 'a21', 'b00', 'b04', 'b05', 'b06', 'b07', 'b08', 'b09', 'b10', 'b11', 'b12', 'c01', 'c02', 'c03', 'c04', 'c05', 'c13'];
  document.getElementById('box').innerHTML = all.map((x) => `<img src="../img/${x}.webp" alt=""${owned.has(x) ? '' : ' class="no"'}>`).join('');
</script>
</body>
</html>
