<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>온보딩</title>
<style>
  /* 앱 onboarding.dart: 3장 넘기기 → 마지막에 "시작하기"를 누르면 로그인 */
  .skip { position: absolute; right: 16px; top: 59px; border: 0; background: none; color: var(--muted); font-size: 14px; padding: 10px 12px; }
  .slide { position: absolute; left: 24px; right: 24px; top: 120px; bottom: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .circle { width: 220px; height: 220px; border-radius: 50%; background: var(--peach); display: flex; align-items: center; justify-content: center; }
  .circle img { width: 170px; height: 170px; object-fit: contain; }
  .slide h2 { font-size: 32px; line-height: 1.25; margin-top: 36px; color: var(--forest); }
  .slide p { font-size: 15px; color: var(--muted); line-height: 1.5; margin-top: 12px; }
  .dots { position: absolute; left: 0; right: 0; bottom: 116px; display: flex; justify-content: center; gap: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width .2s; }
  .dots i.on { width: 22px; background: var(--forest); }
  .bottom { left: 24px; right: 24px; bottom: 36px; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<button class="skip" onclick="location.href='Login.dc.html'">건너뛰기</button>
<div class="slide">
  <div class="circle"><img id="img" src="../img/a00.webp" alt=""></div>
  <h2 class="jua" id="t">걸은 골목이<br>지도로 남아요</h2>
  <p id="b">산책할수록 안개가 걷히고<br>내 동네 지도가 밝아져요</p>
</div>
<div class="dots"><i class="on"></i><i></i><i></i></div>
<div class="bottom"><button class="btn" id="go" onclick="next()">다음</button></div>
<script>
  const slides = [
    ['a00', '걸은 골목이<br>지도로 남아요', '산책할수록 안개가 걷히고<br>내 동네 지도가 밝아져요'],
    ['a18', '마음에 드는 곳엔<br>스티커를 붙여요', '고양이 벤치, 골목 책방…<br>나만의 장소를 기록해요'],
    ['a04', '이웃과 함께<br>골목대장이 돼요', '골목 피드와 동네 리더보드로<br>걷는 재미가 두 배'],
  ];
  let i = 0;
  function show() {
    const [s, t, b] = slides[i];
    document.getElementById('img').src = '../img/' + s + '.webp';
    document.getElementById('t').innerHTML = t;
    document.getElementById('b').innerHTML = b;
    document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
    document.getElementById('go').textContent = i === slides.length - 1 ? '시작하기' : '다음';
  }
  function next() { if (i === slides.length - 1) { location.href = 'Login.dc.html'; return; } i++; show(); }
</script>
</body>
</html>
