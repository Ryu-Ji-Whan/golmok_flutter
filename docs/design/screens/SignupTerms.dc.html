<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>약관 동의</title>
<style>
  /* 앱 signup.dart TermsScreen (1/4): 필수 3개 + 선택 1개, 필수를 다 켜야 다음 */
  .hd { height: 44px; display: flex; align-items: center; padding: 0 12px 0 16px; margin-top: 8px; }
  .hd .back { width: 44px; height: 44px; border: 0; background: none; font-size: 28px; color: var(--ink); text-align: left; }
  .hd b { margin-left: auto; font-size: 13px; color: var(--muted); }
  .prog { margin: 0 16px; height: 4px; border-radius: 2px; background: var(--lineSoft); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--forest); }
  .body { position: absolute; top: 103px; bottom: 120px; left: 0; right: 0; overflow-y: auto; padding: 20px 24px 16px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .body h2 { font-family: 'Jua'; font-weight: 400; font-size: 26px; line-height: 1.25; color: var(--forest); }
  .body .subt { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .foot { position: absolute; left: 24px; right: 24px; bottom: 28px; }
  .all { display: flex; align-items: center; gap: 12px; padding: 14px 16px; } .all b { font-size: 16px; }
  .cb { width: 20px; height: 20px; border-radius: 3px; border: 2px solid var(--muted); flex: none; position: relative; cursor: pointer; }
  .cb.on { background: var(--forest); border-color: var(--forest); } .cb.on::after { content: "✓"; position: absolute; inset: -3px 0 0; color: #fff; font-size: 14px; font-weight: 700; text-align: center; }
  .tr { display: flex; align-items: center; gap: 12px; padding: 10px 0 10px 16px; font-size: 14px; }
  .tr em { font-style: normal; font-weight: 700; color: var(--forest); } .tr em.opt { color: var(--muted); }
  .tr a { margin-left: auto; font-size: 13px; color: var(--muted); padding: 6px 10px; text-decoration: none; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="hd"><button class="back" aria-label="뒤로">‹</button><b>1 / 4</b></div>
<div class="prog"><i style="width:25%"></i></div>
<div class="body">
  <h2>골목대장 이용을 위해<br>약관에 동의해 주세요</h2>
  
  <div style="height:20px"></div>
  <div class="card all"><span class="cb" onclick="all_(this)"></span><b>모두 동의할게요</b></div>
  <div style="margin-top:12px">
  <div class="tr"><span class="cb r" onclick="one(this)"></span><span><em>[필수] </em>이용약관</span><a href="SignupTermsDetail.dc.html">보기</a></div>
  <div class="tr"><span class="cb r" onclick="one(this)"></span><span><em>[필수] </em>개인정보 수집·이용</span><a href="SignupTermsDetail.dc.html">보기</a></div>
  <div class="tr"><span class="cb r" onclick="one(this)"></span><span><em>[필수] </em>위치기반서비스 이용약관</span><a href="SignupTermsDetail.dc.html">보기</a></div>
  <div class="tr"><span class="cb o" onclick="one(this)"></span><span><em class="opt">[선택] </em>이벤트·혜택 알림 받기</span><a href="SignupTermsDetail.dc.html">보기</a></div>
  </div>
  <script>
    function sync() { const r = [...document.querySelectorAll(".cb.r")].every(c => c.classList.contains("on"));
      const o = document.querySelector(".cb.o").classList.contains("on");
      document.querySelector(".all .cb").classList.toggle("on", r && o);
      document.getElementById("next").className = r ? "btn" : "btn off"; }
    function one(c) { c.classList.toggle("on"); sync(); }
    function all_(c) { const on = !c.classList.contains("on"); document.querySelectorAll(".tr .cb").forEach(x => x.classList.toggle("on", on)); sync(); }
  </script>
</div>
<div class="foot"><button class="btn off" id="next" onclick="if(!this.classList.contains('off'))location.href='SignupNickname.dc.html'">다음</button></div>
</body>
</html>
