<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>산책 중</title>
<style>
  /* 앱 walk.dart 산책 중: 통계 카드가 초록(걸은 시간·거리·이번 산책 기록), 지도에 주황 경로, 아래 데모 걷기 + 여기 기록하기 / 산책 끝내기 */
  .map { background-image: url(../img/theme-pastel.jpg); background-position: 40% center; }
  .fog { position: absolute; inset: 0; }
  .top { position: absolute; left: 16px; right: 16px; top: 57px; z-index: 5; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .chipw { background: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 4px 14px 4px 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .area { background: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--forest); }
  .stats { margin-top: 10px; background: var(--forest); border-radius: 22px; box-shadow: var(--shadow); padding: 12px 0; display: flex; justify-content: space-evenly; text-align: center; }
  .stats b { display: block; font-family: 'Jua'; font-weight: 400; font-size: 24px; color: #fff; line-height: 1.25; }
  .stats span { font-size: 12px; color: var(--mint); }
  .fab { position: absolute; right: 16px; bottom: 234px; width: 40px; height: 40px; border: 0; border-radius: 12px; background: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; z-index: 5; }
  .fab svg { width: 24px; height: 24px; fill: var(--forest); }
  .mk { position: absolute; width: 46px; height: 46px; transform: translate(-50%, -100%); filter: drop-shadow(2px 2px 0 #24322C); }
  .acts { position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 5; }
  .demo { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
  .demo svg { width: 18px; height: 18px; fill: var(--forest); }
  .two { display: flex; gap: 10px; }
  .two .btn { flex: 1; }
  .two svg { width: 22px; height: 22px; fill: currentColor; }
  .end { background: var(--orangeText); box-shadow: 0 6px 14px rgba(164,80,11,.3); }
</style>
</head>
<body>
<div class="map"></div>
<svg class="fog" viewBox="0 0 390 844" aria-hidden="true">
  <defs><mask id="m"><rect width="390" height="844" fill="#fff"/><g id="holes" fill="#000"></g></mask></defs>
  <rect width="390" height="844" fill="rgba(112,120,114,.55)" mask="url(#m)"/>
  <!-- 이번 산책 경로 (잉크 테두리 + 주황) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline id="route1" stroke="#24322C" stroke-width="9"/>
    <polyline id="route2" stroke="#F39A45" stroke-width="5"/>
  </g>
  <circle cx="232" cy="404" r="18" fill="#0E5A3C" opacity=".2"/>
  <circle cx="232" cy="404" r="8" fill="#0E5A3C" stroke="#fff" stroke-width="3"/>
</svg>
<img class="mk" src="../img/a13.webp" alt="" style="left:196px;top:520px">

<div class="status" style="position:absolute;left:0;right:0;top:0;z-index:5"><span>9:41</span><i></i></div>
<div class="top">
  <div class="bar">
    <div class="chipw"><div class="av" style="width:36px;height:36px"><img src="../img/a00.webp" alt=""></div>골목대장</div>
    <div class="area">행궁동</div>
  </div>
  <div class="stats">
    <div><b>23분</b><span>걸은 시간</span></div>
    <div><b>1.4km</b><span>거리</span></div>
    <div><b>1곳</b><span>이번 산책 기록</span></div>
  </div>
</div>
<button class="fab" aria-label="내 위치"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>
<div class="acts">
  <button class="demo"><svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zm-2 10H6V7h12v12zm-9-6c-.83 0-1.5-.67-1.5-1.5S8.17 10 9 10s1.5.67 1.5 1.5S9.83 13 9 13zm7.5-1.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5zM8 15h8v2H8v-2z"/></svg>데모 걷기</button>
  <div class="two">
    <button class="btn outline"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>여기 기록하기</button>
    <button class="btn end">산책 끝내기</button>
  </div>
</div>

<nav class="tabbar" data-on="walk"></nav>
<script src="tabbar.js"></script>
<script>
  // 예전에 밝힌 길 + 지금 걷고 있는 길 → 안개 구멍. 지금 길은 주황 선으로
  const walk = [[0, 730], [105, 650], [150, 560], [196, 520], [215, 470], [232, 404]];
  const lines = [walk, [[196, 520], [250, 600], [330, 560], [390, 500]]];
  let h = '', k = 0;
  lines.forEach((pts) => { for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], n = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 9);
    for (let s = 0; s <= n; s++) { k++; const t = s / n; h += `<circle cx="${(x1 + (x2 - x1) * t + Math.sin(k * 2.1) * 6).toFixed(1)}" cy="${(y1 + (y2 - y1) * t + Math.cos(k * 1.7) * 6).toFixed(1)}" r="${(30 + Math.sin(k * 3.3) * 5).toFixed(1)}"/>`; }
  } });
  document.getElementById('holes').innerHTML = h;
  const pts = walk.map((p) => p.join(',')).join(' ');
  document.getElementById('route1').setAttribute('points', pts);
  document.getElementById('route2').setAttribute('points', pts);
</script>
</body>
</html>
