<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>약관 보기</title>
<style>
  /* 앱 signup.dart TermsScreen "보기": 화면 70% 높이 바텀시트. 약관 본문은 아직 자리만 있고(법무 검토 전), 버튼은 "확인" 하나 */
  .under { position: absolute; inset: 0; width: 390px; height: 844px; border: 0; }
  .scrim { position: absolute; inset: 0; background: rgba(36,50,44,.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 591px; background: #fff; border-radius: 28px 28px 0 0; padding: 20px 24px 28px; display: flex; flex-direction: column; }
  .sheet h3 { font-size: 18px; font-weight: 700; }
  .sheet .txt { flex: 1; overflow-y: auto; margin-top: 12px; font-size: 14px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<iframe class="under" src="SignupTerms.dc.html" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
<div class="scrim"></div>
<div class="sheet">
  <h3>위치기반서비스 이용약관</h3>
  <div class="txt">[약관 본문 자리]<br><br>실제 서비스에서는 법무 검토를 거친 약관 전문이 들어가요.<br><br>골목대장은 산책 경로와 위치를 지도에 기록하기 위해 위치 정보를 사용해요. 기록은 기본적으로 이 폰 안에만 저장되고, 공유를 선택한 기록만 골목 피드에 보여요.</div>
  <button class="btn" onclick="location.href='SignupTerms.dc.html'">확인</button>
</div>
</body>
</html>
