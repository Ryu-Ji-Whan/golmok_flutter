<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>밝힌 곳에 스티커 붙이기</title>
<style>
  .map { background-image: url(../img/theme-pastel.jpg); }
  .fog { position: absolute; inset: 0; }
  .pick { position: absolute; left: 172px; top: 452px; width: 50px; height: 50px; border-radius: 50%; border: 3px dashed var(--orange); background: rgba(255,255,255,.6);
    display: flex; align-items: center; justify-content: center; font: 700 28px sans-serif; color: var(--orangeText); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  .top { position: absolute; left: 16px; right: 16px; top: 57px; display: flex; justify-content: space-between; }
  .chipw { background: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 4px 14px 4px 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 120px; background: #2F3A35; color: #fff; border-radius: 10px; padding: 14px 16px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div class="map"></div>
<!-- 안개: 걸어서 밝힌 길만 동글동글 뚫려 있다 -->
<svg class="fog" viewBox="0 0 390 844" aria-hidden="true">
  <defs><mask id="m"><rect width="390" height="844" fill="#fff"/>
    <g fill="#000"><circle cx="37" cy="695" r="30"/><circle cx="44" cy="685" r="30"/><circle cx="62" cy="684" r="34"/><circle cx="62" cy="670" r="29"/><circle cx="69" cy="655" r="28"/><circle cx="87" cy="654" r="34"/><circle cx="94" cy="636" r="29"/><circle cx="100" cy="634" r="35"/><circle cx="111" cy="618" r="32"/><circle cx="117" cy="615" r="28"/><circle cx="123" cy="602" r="35"/><circle cx="136" cy="599" r="29"/><circle cx="145" cy="591" r="35"/><circle cx="149" cy="578" r="30"/><circle cx="151" cy="566" r="28"/><circle cx="153" cy="559" r="26"/><circle cx="155" cy="545" r="29"/><circle cx="165" cy="531" r="29"/><circle cx="176" cy="516" r="30"/><circle cx="171" cy="513" r="29"/><circle cx="177" cy="506" r="29"/><circle cx="184" cy="500" r="27"/><circle cx="183" cy="483" r="34"/><circle cx="194" cy="475" r="29"/><circle cx="193" cy="470" r="26"/><circle cx="205" cy="466" r="36"/><circle cx="211" cy="459" r="26"/><circle cx="211" cy="451" r="34"/><circle cx="218" cy="442" r="32"/><circle cx="228" cy="426" r="28"/><circle cx="229" cy="416" r="30"/><circle cx="241" cy="408" r="26"/><circle cx="235" cy="396" r="34"/><circle cx="243" cy="387" r="27"/><circle cx="256" cy="379" r="28"/><circle cx="250" cy="365" r="28"/><circle cx="262" cy="356" r="26"/><circle cx="267" cy="350" r="36"/><circle cx="269" cy="347" r="34"/><circle cx="279" cy="346" r="31"/><circle cx="284" cy="332" r="26"/><circle cx="292" cy="324" r="35"/><circle cx="304" cy="320" r="26"/><circle cx="304" cy="309" r="28"/><circle cx="310" cy="308" r="27"/><circle cx="315" cy="300" r="32"/><circle cx="333" cy="286" r="35"/><circle cx="335" cy="282" r="33"/><circle cx="340" cy="265" r="28"/><circle cx="351" cy="268" r="35"/><circle cx="351" cy="259" r="34"/><circle cx="362" cy="254" r="31"/><circle cx="369" cy="246" r="29"/><circle cx="378" cy="242" r="27"/></g></mask></defs>
  <rect width="390" height="844" fill="rgba(112,120,114,.55)" mask="url(#m)" onclick="fogTap()" style="cursor:pointer"/>
</svg>
<div class="status" style="position:absolute;left:0;right:0;top:0"><span>9:41</span><i></i></div>
<div class="top"><div class="chipw"><div class="av" style="width:36px;height:36px"><img src="../img/a00.webp" alt=""></div>골목대장</div><div class="chipw" style="padding:8px 14px;color:var(--forest)">행궁동</div></div>
<div class="pick">+</div>
<div class="toast" id="toast">아직 안개 낀 곳이에요. 걸어서 밝힌 곳에만 스티커를 붙일 수 있어요</div>
<div class="bottom">
  <div class="card row" style="padding:12px 10px 12px 14px">
    <span style="font-size:22px;color:var(--orange)">📍</span>
    <div class="grow"><div style="font-size:14px;font-weight:700">이 자리에 스티커를 붙일까요?</div><div class="sub">내가 걸어서 밝힌 골목이에요</div></div>
    <button class="chip ghost">취소</button><button class="chip" style="background:var(--orange)">붙이기</button>
  </div>
</div>
<script>
  function fogTap() { const t = document.getElementById('toast'); t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2000); }
</script>
</body>
</html>
