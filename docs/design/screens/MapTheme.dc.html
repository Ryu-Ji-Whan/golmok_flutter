<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>지도 테마</title>
<style>
  .preview { margin: 0 16px; height: 330px; border: 2px solid var(--ink); border-radius: 22px; background: center / cover no-repeat; transition: background-image .2s; }
  .list { padding: 8px 16px 0; height: 340px; overflow: auto; }
  .th { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 18px; border: 1px solid var(--line); background: #fff; margin-bottom: 8px; cursor: pointer; }
  .th.on { background: var(--mint); border: 2px solid var(--forest); }
  .th .thumb { width: 44px; height: 44px; border-radius: 10px; background: center / cover; flex: none; }
  .th .radio { margin-left: auto; }
  .th.on .radio { border: 6px solid var(--forest); }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back">‹</button><h1>지도 테마</h1></div>
<div class="preview" id="pv"></div>
<p class="sub" style="padding:10px 20px 0;line-height:1.4">테마를 누르면 위 지도가 바로 바뀌어요.</p>
<div class="list" id="list"></div>
<div class="bottom" style="bottom:20px"><button class="btn off" id="ok">지금 쓰는 테마예요</button></div>
<script>
  const T = [
    ['pastel', '골목 파스텔', '기본 만화풍. 굵은 외곽선과 건물 그림자'],
    ['night', '밤 산책', '창문마다 불이 켜진 밤 골목, 가로등 길, 반짝이는 별'],
    ['treasure', '보물 지도', '그을려 삭은 테두리와 탄 구멍, 점선 길, 나침반'],
    ['sketch', '연필 스케치', '모눈 공책에 연필로 그린 흑백 지도'],
    ['watercolor', '수채화', '외곽선 없이 물감이 번진 지도'],
    ['sakura', '벚꽃 골목', '꽃 무늬 공원과 살랑살랑 떨어지는 꽃잎'],
    ['retro', '레트로 게임', '각진 길, 화면 격자와 주사선, 게임기 테두리'],
  ];
  let sel = new URLSearchParams(location.search).get('t') || 'night';
  const using = 'pastel';
  function draw() {
    document.getElementById('pv').style.backgroundImage = 'url(../img/theme-' + sel + '.jpg)';
    document.getElementById('list').innerHTML = T.map(([id, n, d]) =>
      '<div class="th' + (id === sel ? ' on' : '') + '" onclick="sel=\'' + id + '\';draw()"><div class="thumb" style="background-image:url(../img/theme-' + id + '.jpg)"></div>' +
      '<div><div class="name">' + n + (id === using ? ' <span class="pill">지금 쓰는 중</span>' : '') + '</div><div class="sub">' + d + '</div></div><span class="radio"></span></div>').join('');
    const ok = document.getElementById('ok');
    ok.className = 'btn' + (sel === using ? ' off' : '');
    ok.textContent = sel === using ? '지금 쓰는 테마예요' : '이 테마로 하기';
  }
  draw();
</script>
</body>
</html>
