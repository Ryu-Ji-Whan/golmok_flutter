<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>카카오 로그인 중</title>
<style>
  /* 앱 login.dart: 카카오를 누르면 브라우저 로그인 창이 열리고, 버튼은 "로그인 창에서 계속해 주세요"로 바뀐다. 다른 버튼은 잠긴다 */
  .wrap { padding: 0 24px; text-align: center; }
  .logo { font-size: 44px; color: var(--forest); line-height: 1.1; }
  .field { height: 56px; border: 1px solid var(--line); border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; color: var(--muted); font-size: 16px; }
  .field .ic { width: 22px; font-size: 18px; text-align: center; }
  .links { display: flex; align-items: center; justify-content: center; gap: 2px; margin-top: 4px; font-size: 13px; color: var(--muted); opacity: .5; }
  .links span { padding: 10px 8px; }
  .or { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; font-size: 12px; color: var(--muted); }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .kakao { height: 54px; width: 100%; border: 0; border-radius: 27px; background: #FEE500; color: #191600; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .spin { width: 18px; height: 18px; border: 2.4px solid rgba(25,22,0,.25); border-top-color: #191600; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back" aria-label="뒤로">‹</button></div>
<div class="wrap">
  <div class="jua logo">골목대장</div>
  <p style="font-size:15px;color:var(--muted);margin-top:4px">내가 걸은 골목이 지도로 남아요</p>
  <img src="../img/a04.webp" alt="" style="width:120px;height:120px;object-fit:contain;margin:10px 0 18px">
  <div class="field"><span class="ic">👤</span>아이디</div>
  <div class="field" style="margin-top:12px"><span class="ic">🔒</span><span style="flex:1">비밀번호</span><span class="ic">👁</span></div>
  <button class="btn off" style="height:54px;margin-top:16px">로그인</button>
  <div class="links">처음이에요?<span style="font-weight:700;font-size:14px">회원가입</span>·<span>아이디·비밀번호 찾기</span></div>
  <div class="or">또는</div>
  <button class="kakao"><span class="spin"></span>로그인 창에서 계속해 주세요</button>
  <div style="margin-top:10px;font-size:13px;color:var(--muted);padding:8px;opacity:.5">로그인 없이 둘러보기</div>
  <p style="font-size:11px;color:var(--muted)">로그인하면 기록이 내 계정에 저장돼서 폰을 바꿔도 이어져요</p>
</div>
</body>
</html>
