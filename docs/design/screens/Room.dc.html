<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>친구 방 안</title>
<style>
  /* 앱 rooms.dart RoomScreen: 따로 열리는 화면(아래 탭 줄 없음). 지도(화면 40%)에 사람마다 색이 다른 오늘 경로 + 끝에 이름표, 방에 올린 스티커 */
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; flex: none; }
  .ib svg { width: 24px; height: 24px; }
  .mapcard { position: relative; margin: 0 16px; height: 338px; border: 2px solid var(--ink); border-radius: 22px; overflow: hidden; }
  .mapcard .bg { position: absolute; inset: 0; background: url(../img/theme-pastel.jpg) 50% 60% / 520px auto no-repeat; }
  .mapcard svg { position: absolute; inset: 0; }
  .tag { position: absolute; transform: translate(-50%, -100%); margin-top: -6px; padding: 2px 8px; border-radius: 999px; border: 2px solid #24322C; color: #fff; font: 700 12px/1.3 sans-serif; white-space: nowrap; box-shadow: 2px 2px 0 #24322C; }
  .seg { margin: 10px 16px 4px; display: flex; height: 40px; border: 1px solid #7C8580; border-radius: 20px; overflow: hidden; }
  .seg a { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--ink); }
  .seg a + a { border-left: 1px solid #7C8580; }
  .seg a.on { background: var(--mint); color: var(--forest); font-weight: 700; }
  .list { padding: 6px 16px 0; height: 238px; overflow: hidden; }
  .person { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 8px; }
  .person .bar { width: 6px; height: 40px; border-radius: 3px; flex: none; }
  .person .av { width: 40px; height: 40px; }
  .sw { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; padding: 10px 16px; }
  .toggle { width: 52px; height: 32px; border-radius: 16px; border: 2px solid #7C8580; background: var(--sand); position: relative; flex: none; cursor: pointer; }
  .toggle::after { content: ''; position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: #7C8580; transition: .15s; }
  .toggle.on { background: var(--leaf); border-color: var(--leaf); }
  .toggle.on::after { left: 22px; top: 2px; width: 24px; height: 24px; background: #fff; }
  .foot { position: absolute; left: 16px; right: 16px; bottom: 44px; }
  .foot svg { width: 22px; height: 22px; fill: #fff; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar">
  <button class="back" aria-label="뒤로" onclick="location.href='Rooms.dc.html'">‹</button>
  <h1>우리 동네 산책단</h1>
  <button class="ib" aria-label="친구 초대" onclick="location.href='RoomInvite.dc.html'"><svg viewBox="0 0 24 24" fill="#0E5A3C"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 8c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm-6 4c.22-.72 3.31-2 6-2 2.7 0 5.8 1.29 6 2H9zm-3-3v-3h3v-2H6V7H4v3H1v2h3v3z"/></svg></button>
  <button class="ib" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="#24322C"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
</div>

<!-- 방 지도: 안개 없음. 고양이·참새 스티커는 방 사람들이 올린 기록 2개 -->
<div class="mapcard" id="map">
  <div class="bg"></div>
  <svg viewBox="0 0 354 334" aria-hidden="true"><g id="tracks" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
    <circle cx="232" cy="160" r="18" fill="#0E5A3C" opacity=".2"/><circle cx="232" cy="160" r="8" fill="#0E5A3C" stroke="#fff" stroke-width="3"/></svg>
</div>

<div class="seg"><a class="on">사람 3</a><a>스티커 2</a></div>
<div class="list">
  <div class="person"><span class="bar" style="background:#E4572E"></span><div class="av"><img src="../img/a00.webp" alt=""></div><div class="grow"><div class="name">골목대장 (나)</div><div class="sub">오늘 2.1km 걸음</div></div></div>
  <div class="person"><span class="bar" style="background:#2E86DE"></span><div class="av"><img src="../img/c01.webp" alt=""></div><div class="grow"><div class="name">골목참새</div><div class="sub">오늘 1.4km 걸음</div></div></div>
  <div class="person"><span class="bar" style="background:#17A589"></span><div class="av"><img src="../img/a21.webp" alt=""></div><div class="grow"><div class="name">노을사냥꾼</div><div class="sub">오늘 860m 걸음</div></div></div>
  <div class="sw">
    <div class="grow"><div style="font-size:14px;font-weight:700">이 방에서 내 경로 숨기기</div><div class="sub">켜면 이 방 사람들에게 내 오늘 경로가 안 보여요</div></div>
    <span class="toggle" onclick="this.classList.toggle('on')"></span>
  </div>
</div>
<div class="foot"><button class="btn orange"><svg viewBox="0 0 24 24"><path d="M18 15v3H6v-3H4v3c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-3h-2zM7 9l1.41 1.41L11 7.83V16h2V7.83l2.59 2.58L17 9l-5-5-5 5z"/></svg>내 스티커 방에 올리기</button></div>

<script>
  // 사람마다 다른 색의 오늘 경로 (잉크 테두리 + 색 선), 경로 끝에 이름표
  const tracks = [
    ['#E4572E', '골목대장', [[30, 310], [70, 262], [130, 246], [168, 200], [232, 160]]],
    ['#2E86DE', '골목참새', [[340, 300], [300, 262], [262, 246], [236, 212], [300, 150], [318, 64]]],
    ['#17A589', '노을사냥꾼', [[14, 40], [60, 76], [104, 60], [146, 104], [122, 150]]],
  ];
  let g = '', tags = '';
  tracks.forEach(([c, n, pts]) => {
    const p = pts.map((x) => x.join(',')).join(' ');
    g += `<polyline points="${p}" stroke="#24322C" stroke-width="8" stroke-opacity=".85"/><polyline points="${p}" stroke="${c}" stroke-width="5"/>`;
    const [x, y] = pts[pts.length - 1];
    tags += `<div class="tag" style="left:${x + 2}px;top:${y + 2}px;background:${c}">${n}</div>`;
  });
  document.getElementById('tracks').innerHTML = g;
  document.getElementById('map').insertAdjacentHTML('beforeend', tags);
</script>
</body>
</html>
