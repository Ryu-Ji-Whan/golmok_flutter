<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>내 동네 고르기</title>
<style>
  /* 앱 signup.dart AreaScreen + widgets/area_picker.dart: 현재 위치로 찾기 + 전국 동·읍·면 검색 (고정 목록 없음) */
  .hd { height: 44px; display: flex; align-items: center; padding: 0 12px 0 16px; margin-top: 8px; }
  .hd .back { width: 44px; height: 44px; border: 0; background: none; font-size: 28px; color: var(--ink); text-align: left; }
  .hd b { margin-left: auto; font-size: 13px; color: var(--muted); }
  .prog { margin: 0 16px; height: 4px; border-radius: 2px; background: var(--lineSoft); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--forest); }
  .body { position: absolute; top: 103px; bottom: 120px; left: 0; right: 0; overflow-y: auto; padding: 20px 24px 16px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .body h2 { font-family: 'Jua'; font-weight: 400; font-size: 26px; line-height: 1.25; color: var(--forest); }
  .body .subt { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .foot { position: absolute; left: 24px; right: 24px; bottom: 28px; }
  .tile { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 18px; background: #fff; margin-bottom: 8px; }
  .tile.on { background: var(--mint); } .tile .ic { color: var(--muted); font-size: 18px; width: 22px; text-align: center; } .tile.on .ic { color: var(--forest); }
  .tile b { display: block; font-size: 14px; font-weight: 500; } .tile span { font-size: 12px; color: var(--muted); }
  .srch { height: 52px; border: 1px solid var(--line); border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="hd"><button class="back" aria-label="뒤로">‹</button><b>4 / 4</b></div>
<div class="prog"><i style="width:100%"></i></div>
<div class="body">
  <h2>내 동네를 골라 주세요</h2>
  <p class="subt">동네 리더보드와 골목 피드가 이 동네 기준으로 보여요. 나중에 프로필에서 바꿀 수 있어요</p>
  <div style="height:20px"></div>
  <button class="btn outline" style="height:50px">◎ 현재 위치로 내 동네 찾기</button>
  <div style="height:10px"></div>
  <div class="tile on"><span class="ic">◎</span><div style="flex:1"><b>수원시 팔달구 행궁동</b><span>지금 있는 곳</span></div><span style="color:var(--forest);font-size:20px">✔</span></div>
  <div style="height:6px"></div>
  <div class="srch" style="color:var(--muted)"><span>🔍</span>동·읍·면 이름으로 찾기 (예: 연남동, 해운대)</div>
  <div style="height:12px"></div>
  <p style="font-size:11px;color:var(--muted);margin-top:4px">동네 이름 © OpenStreetMap 기여자</p>
</div>
<div class="foot"><button class="btn" onclick="location.href='SignupDone.dc.html'">다음</button></div>
</body>
</html>
