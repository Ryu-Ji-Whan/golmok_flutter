<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>카드 사진으로 공유</title>
<style>
  /* 앱 share_card.dart: 기록 하나를 4:5 스티커 카드(1080×1350 PNG) 한 장으로 만들어 공유·앨범 저장. 좌표·경로는 안 들어감 */
  .holder { width: 300px; height: 375px; margin: 10px auto 0; }
  .sc { width: 320px; height: 400px; transform: scale(.9375); transform-origin: 0 0; background: var(--cream); border: 3px solid var(--ink); border-radius: 26px; padding: 14px; display: flex; flex-direction: column; }
  .sc .ph { flex: 1; border-radius: 18px; background: var(--peach) url(../img/bench.jpg) center / cover; position: relative; }
  .sc .ph img { position: absolute; right: 8px; bottom: 8px; width: 84px; height: 84px; object-fit: contain; }
  .sc .t { font-family: 'Jua'; font-size: 24px; color: var(--forest); margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc .m { font-size: 13px; line-height: 1.45; margin-top: 4px; }
  .sc .foot { display: flex; align-items: center; gap: 3px; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .sc .foot img { width: 26px; height: 26px; object-fit: contain; }
  .tile { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; }
  .tile .tt { font-size: 16px; }
  .sw { width: 52px; height: 32px; border-radius: 16px; background: var(--leaf); position: relative; flex: none; cursor: pointer; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.off { background: var(--line); }
  .sw.off::after { left: 4px; width: 16px; height: 16px; top: 8px; background: var(--muted); }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back" aria-label="뒤로">‹</button><h1>SNS에 공유하기</h1></div>
<div style="padding:4px 16px 0">
  <p class="sub" style="font-size:13px">이 카드 한 장이 사진으로 보내져요</p>
  <div class="holder"><div class="sc">
    <div class="ph"><img src="../img/a21.webp" alt=""></div>
    <div class="t">저녁마다 고양이가 모이는 벤치</div>
    <div class="m" id="memo">해 질 무렵 이 벤치에 앉으면 노란 고양이가 꼭 옆에 와서 앉아요.</div>
    <div class="foot"><span style="color:var(--orange);font-size:14px">📍</span><span style="flex:1" id="foot">행궁동 · 2026.11.19</span><img src="../img/c13.webp" alt=""><span class="jua" style="font-size:17px;color:var(--forest);font-weight:400">골목대장</span></div>
  </div></div>
  <div class="tile" style="margin-top:6px"><div class="grow"><div class="tt">동네 이름 넣기</div><div class="sub" style="font-size:13px">행궁동 · 정확한 위치는 들어가지 않아요</div></div><span class="sw" onclick="tog(this,'area')"></span></div>
  <div class="tile"><div class="grow tt">메모 넣기</div><span class="sw" onclick="tog(this,'memo')"></span></div>
  <button class="btn" style="margin-top:12px;height:64px;border-radius:32px">⇪ 카톡·인스타 등에 공유하기</button>
  <button class="btn outline" style="margin-top:10px">⤓ 앨범에 저장</button>
</div>
<script>
  // 스위치를 끄면 카드에서 동네 이름·메모가 빠진다
  function tog(el, what) {
    const on = el.classList.toggle('off') === false;
    if (what === 'memo') document.getElementById('memo').style.display = on ? '' : 'none';
    else document.getElementById('foot').textContent = on ? '행궁동 · 2026.11.19' : '2026.11.19';
  }
</script>
</body>
</html>
