<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>여기 기록하기</title>
<style>
  /* 앱 record.dart: 스티커 고르기 → 제목·메모 → 사진(선택) → 공개 범위 → 저장하기. 아래로 스크롤된다 */
  .scroll { position: absolute; top: 103px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 4px 16px 28px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .prev { width: 96px; height: 96px; border-radius: 18px; background: var(--peach); display: flex; align-items: center; justify-content: center; flex: none; }
  .prev img { width: 80px; height: 80px; object-fit: contain; }
  .cats { display: flex; gap: 8px; }
  .cat { height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 500; display: flex; align-items: center; }
  .cat.on { background: var(--mint); border-color: var(--mint); color: var(--forest); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
  .grid div { aspect-ratio: 1; border-radius: 14px; background: #fff; border: 1px solid var(--lineSoft); display: flex; align-items: center; justify-content: center; }
  .grid div.on { background: var(--peach); border: 2px solid var(--orange); }
  .grid img { width: 80%; height: 80%; object-fit: contain; }
  .input { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 14px 16px; font-size: 15px; color: var(--muted); }
  .count { text-align: right; font-size: 12px; color: var(--muted); margin: 4px 4px 6px; }
  .seg { display: flex; height: 44px; border: 1px solid var(--muted); border-radius: 22px; overflow: hidden; }
  .seg span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
  .seg span + span { border-left: 1px solid var(--muted); }
  .seg span.on { background: var(--mint); color: var(--forest); font-weight: 700; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back" aria-label="뒤로">‹</button><h1>여기 기록하기</h1></div>
<div class="scroll">
  <div class="card row" style="gap:14px">
    <div class="prev"><img src="../img/a18.webp" alt=""></div>
    <div><div class="jua" style="font-size:20px;color:var(--forest)">벤치</div><div class="sub" style="font-size:13px;margin-top:4px">지금 서 있는 곳에 붙여요</div></div>
  </div>
  <div class="sec">스티커 고르기</div>
  <div class="cats"><span class="cat on">전체</span><span class="cat">고양이</span><span class="cat">참새</span><span class="cat">소품</span><span class="cat">장소</span></div>
  <div class="grid">
    <div><img src="../img/a00.webp" alt=""></div><div><img src="../img/a01.webp" alt=""></div><div><img src="../img/a02.webp" alt=""></div><div><img src="../img/a04.webp" alt=""></div><div><img src="../img/a11.webp" alt=""></div>
    <div><img src="../img/a13.webp" alt=""></div><div><img src="../img/a14.webp" alt=""></div><div><img src="../img/a15.webp" alt=""></div><div><img src="../img/a17.webp" alt=""></div><div class="on"><img src="../img/a18.webp" alt=""></div>
    <div><img src="../img/a19.webp" alt=""></div><div><img src="../img/a20.webp" alt=""></div><div><img src="../img/a21.webp" alt=""></div><div><img src="../img/c01.webp" alt=""></div><div><img src="../img/c13.webp" alt=""></div>
  </div>
  <div class="sec">어떤 곳인가요?</div>
  <div class="input" style="color:var(--ink)">저녁마다 고양이가 모이는 벤치</div>
  <div class="count">15/30</div>
  <div class="input" style="height:92px">메모 (선택)</div>
  <div class="count">0/200</div>
  <div class="sec">사진</div>
  <div id="photo"><button class="btn outline" onclick="location.href='PhotoAdd.dc.html'">📷 사진 넣기</button></div>
  <div class="sec">누구에게 보일까요?</div>
  <div class="seg"><span class="on">전체 공개</span><span>친구만</span><span>나만 보기</span></div>
  <button class="btn" style="margin-top:28px">저장하기</button>
</div>
<script>
  // 다른 시안이 이 화면을 겹쳐 쓸 때: ?photo = 사진을 넣은 뒤, ?scroll=숫자 = 그만큼 내려 둔 상태
  const q = location.search;
  if (q.includes('photo')) {
    document.getElementById('photo').innerHTML =
      '<div style="position:relative;height:200px;border-radius:18px;overflow:hidden;background:url(../img/bench.jpg) center/cover">' +
      '<img src="../img/a18.webp" alt="" style="position:absolute;right:10px;bottom:10px;width:64px;height:64px;object-fit:contain"></div>' +
      '<div style="display:flex;gap:10px;margin-top:10px"><button class="btn outline" style="height:48px">🖼 사진 바꾸기</button>' +
      '<button class="btn" style="height:48px;font-size:15px" onclick="location.href=\'PhotoEdit.dc.html\'">✦ 스티커로 꾸미기</button></div>';
  }
  const m = q.match(/scroll=(\d+)/);
  if (m) document.querySelector('.scroll').scrollTop = +m[1];
</script>
</body>
</html>
