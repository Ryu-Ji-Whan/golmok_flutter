<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>닉네임</title>
<style>
  /* 앱 signup.dart NicknameScreen (2/4): 2~10자, 한글·영문·숫자만, 서버에서 겹치는지 확인 */
  .hd { height: 44px; display: flex; align-items: center; padding: 0 12px 0 16px; margin-top: 8px; }
  .hd .back { width: 44px; height: 44px; border: 0; background: none; font-size: 28px; color: var(--ink); text-align: left; }
  .hd b { margin-left: auto; font-size: 13px; color: var(--muted); }
  .prog { margin: 0 16px; height: 4px; border-radius: 2px; background: var(--lineSoft); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--forest); }
  .body { position: absolute; top: 103px; bottom: 120px; left: 0; right: 0; overflow-y: auto; padding: 20px 24px 16px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .body h2 { font-family: 'Jua'; font-weight: 400; font-size: 26px; line-height: 1.25; color: var(--forest); }
  .body .subt { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .foot { position: absolute; left: 24px; right: 24px; bottom: 28px; }
  .inp { height: 52px; border: 2px solid var(--leaf); border-radius: 14px; background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 16px; }
  .inp i { width: 2px; height: 22px; background: var(--leaf); margin-left: 1px; animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
  .cnt { text-align: right; font-size: 12px; color: var(--muted); margin: 4px 4px 0; }
  .ok { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--leafText); margin-top: 2px; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="hd"><button class="back" aria-label="뒤로">‹</button><b>2 / 4</b></div>
<div class="prog"><i style="width:50%"></i></div>
<div class="body">
  <h2>골목에서 불릴<br>닉네임을 지어 주세요</h2>
  <p class="subt">피드와 리더보드에 보이는 이름이에요</p>
  <div style="height:20px"></div>
  <div class="inp">골목냥이<i></i></div>
  <div class="cnt">4/10</div>
  <div class="ok"><span style="color:var(--leaf)">✔</span>멋진 이름이에요!</div>
</div>
<div class="foot"><button class="btn" onclick="location.href='SignupCharacter.dc.html'">다음</button></div>
</body>
</html>
