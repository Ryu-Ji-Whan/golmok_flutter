<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>산책 시작</title>
<style>
  /* 앱 walk.dart: 지도 전체 + 위 프로필·동네 + 통계 카드, 아래 "산책 시작" (탭 줄 위) */
  .map { background-image: url(../img/theme-pastel.jpg); background-position: 40% center; }
  .fog { position: absolute; inset: 0; }
  .top { position: absolute; left: 16px; right: 16px; top: 57px; z-index: 5; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .chipw { background: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 4px 14px 4px 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .area { background: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--forest); }
  .stats { margin-top: 10px; background: #fff; border-radius: 22px; box-shadow: var(--shadow); padding: 12px 0; display: flex; justify-content: space-evenly; text-align: center; }
  .stats b { display: block; font-family: 'Jua'; font-weight: 400; font-size: 24px; color: var(--forest); line-height: 1.25; }
  .stats span { font-size: 12px; color: var(--muted); }
  .gift { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; background: var(--orange); color: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 6px 12px 6px 8px; font-size: 14px; font-weight: 700; }
  .gift img { width: 30px; height: 30px; object-fit: contain; }
  .gift svg { width: 20px; height: 20px; fill: #fff; }
  .wrap { position: relative; display: flex; justify-content: center; }
  .fab { position: absolute; right: 16px; bottom: 184px; width: 40px; height: 40px; border-radius: 12px; background: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; z-index: 5; }
  .fab svg { width: 24px; height: 24px; fill: var(--forest); }
  .mk { position: absolute; width: 46px; height: 46px; transform: translate(-50%, -100%); filter: drop-shadow(2px 2px 0 #24322C); }
  .start { position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 5; }
  .start svg { width: 24px; height: 24px; fill: #fff; }
</style>
</head>
<body>
<div class="map"></div>
<!-- 안개: 지금까지 걸어서 밝힌 골목만 동글동글 뚫려 있다 -->
<svg class="fog" viewBox="0 0 390 844" aria-hidden="true">
  <defs><mask id="m"><rect width="390" height="844" fill="#fff"/><g id="holes" fill="#000"></g></mask></defs>
  <rect width="390" height="844" fill="rgba(112,120,114,.55)" mask="url(#m)"/>
  <circle cx="196" cy="520" r="18" fill="#0E5A3C" opacity=".2"/>
  <circle cx="196" cy="520" r="8" fill="#0E5A3C" stroke="#fff" stroke-width="3"/>
</svg>
<img class="mk" src="../img/a14.webp" alt="" style="left:248px;top:600px">
<img class="mk" src="../img/a12.webp" alt="" style="left:120px;top:470px">

<div class="status" style="position:absolute;left:0;right:0;top:0;z-index:5"><span>9:41</span><i></i></div>
<div class="top">
  <div class="bar">
    <a class="chipw" href="Profile.dc.html" style="color:inherit;text-decoration:none"><div class="av" style="width:36px;height:36px"><img src="../img/a00.webp" alt=""></div>골목대장</a>
    <div class="area">행궁동</div>
  </div>
  <div class="stats">
    <div><b>3.2km</b><span>이번 주 걸은 거리</span></div>
    <div><b>18.6km</b><span>총 걸은 거리</span></div>
    <div><b>12곳</b><span>기록한 장소</span></div>
  </div>
  <!-- 친구가 보낸 스티커가 있을 때만 -->
  <div class="wrap"><a class="gift" href="GiftReceive.dc.html" style="text-decoration:none"><img src="../img/c13.webp" alt="">골목참새님이 스티커를 보냈어요<svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></a></div>
</div>
<button class="fab" aria-label="내 위치" style="border:0"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>
<div class="start"><button class="btn" onclick="location.href='Explore.dc.html'"><svg viewBox="0 0 24 24"><path d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>산책 시작</button></div>

<nav class="tabbar" data-on="walk"></nav>
<script src="tabbar.js"></script>
<script>
  // 걸어서 밝힌 길 → 안개에 동글동글 구멍
  const lines = [
    [[0, 730], [105, 650], [150, 560], [196, 520], [250, 600], [330, 560], [390, 500]],
    [[196, 520], [215, 400], [300, 330], [390, 300]],
    [[150, 560], [120, 470], [60, 380], [0, 360]],
  ];
  let h = '', k = 0;
  lines.forEach((pts) => { for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], n = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 9);
    for (let s = 0; s <= n; s++) { k++; const t = s / n; h += `<circle cx="${(x1 + (x2 - x1) * t + Math.sin(k * 2.1) * 6).toFixed(1)}" cy="${(y1 + (y2 - y1) * t + Math.cos(k * 1.7) * 6).toFixed(1)}" r="${(30 + Math.sin(k * 3.3) * 5).toFixed(1)}"/>`; }
  } });
  document.getElementById('holes').innerHTML = h;
</script>
</body>
</html>
