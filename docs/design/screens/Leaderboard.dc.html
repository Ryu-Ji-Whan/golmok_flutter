<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>동네 리더보드</title>
<style>
  /* 앱 town.dart: 동네 탭 = [친구 방 | 리더보드]. 리더보드는 실제로 걸은 동에서 이번 주 걸은 거리로 순위 */
  .appbar { padding: 0 16px; }
  .appbar h1 { font-family: 'Jua'; font-weight: 400; font-size: 24px; }
  .tabs { display: flex; height: 48px; border-bottom: 1px solid var(--lineSoft); }
  .tabs a { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--muted); text-decoration: none; position: relative; }
  .tabs a.on { color: var(--forest); }
  .tabs a.on::after { content: ''; position: absolute; bottom: -1px; left: 50%; width: 64px; margin-left: -32px; height: 3px; border-radius: 3px 3px 0 0; background: var(--forest); }
  .scroll { height: calc(844px - 47px - 56px - 49px - 84px); overflow: hidden; padding: 4px 16px 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .cc { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--forest); font-size: 14px; font-weight: 700; }
  .cc svg { width: 18px; height: 18px; fill: currentColor; }
  .cc.on { background: var(--forest); color: #fff; border-color: var(--forest); }
  .head { background: var(--forest); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: flex; align-items: center; gap: 14px; color: #fff; }
  .head .av { width: 56px; height: 56px; }
  .head small { display: block; font-size: 12px; color: var(--mint); }
  .head b { display: block; font-family: 'Jua'; font-weight: 400; font-size: 28px; line-height: 1.2; }
  .podium { display: flex; align-items: flex-end; margin-top: 16px; }
  .podium > div { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .podium .nm { font-size: 12px; font-weight: 700; margin: 4px 0; }
  .podium .blk { align-self: stretch; margin: 0 4px; border: 2px solid var(--ink); border-bottom: 0; border-radius: 14px 14px 0 0; background: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Jua'; font-size: 28px; }
  .sect { display: flex; align-items: center; padding: 20px 0 10px; }
  .sect h2 { flex: 1; font-size: 17px; font-weight: 700; }
  .rk { display: flex; align-items: center; background: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 6px; }
  .rk.me { background: var(--mint); border: 1px solid var(--leaf); }
  .rk .n { width: 28px; font-family: 'Jua'; font-size: 18px; color: var(--muted); }
  .rk .n.top { color: var(--orangeText); }
  .rk .av { width: 36px; height: 36px; margin-right: 10px; }
  .rk .d { font-weight: 700; color: var(--forest); font-size: 14px; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><h1>동네</h1></div>
<div class="tabs"><a href="Rooms.dc.html">친구 방</a><a class="on">리더보드</a></div>
<div class="scroll">

    <span class="cc on"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>지금 여기 · 행궁동</span>

  </div>
  <div class="head">
    <div class="av"><img src="../img/a00.webp" alt=""></div>

    <div><div class="av" style="width:52px;height:52px"><img src="../img/a21.webp" alt=""></div><div class="nm">노을사냥꾼</div><div class="blk" style="height:56px">3</div></div>
  </div>
  <div class="sect"><h2>전체 순위</h2><span class="sub">이번 주 걸은 거리</span></div>
  <div class="rk"><span class="n top">1</span><div class="av"><img src="../img/a04.webp" alt=""></div><span class="grow name" style="font-size:14px">행궁산책러</span><span class="d">5.4km</span></div>

  <div class="rk"><span class="n top">3</span><div class="av"><img src="../img/a21.webp" alt=""></div><span class="grow name" style="font-size:14px">노을사냥꾼</span><span class="d">2.7km</span></div>
  <div class="rk"><span class="n">4</span><div class="av"><img src="../img/c01.webp" alt=""></div><span class="grow name" style="font-size:14px">골목참새</span><span class="d">1.9km</span></div>
  <div class="rk"><span class="n">5</span><div class="av"><img src="../img/a19.webp" alt=""></div><span class="grow name" style="font-size:14px">dongne_walker</span><span class="d">850m</span></div>
</div>

</html>
