<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>받은 스티커</title>
<style>
  .map { top: 103px; background-image: url(../img/theme-pastel.jpg); }
  .target { position: absolute; left: 195px; top: 430px; }
  .sticker { position: absolute; left: -32px; top: -64px; width: 64px; height: 64px; filter: drop-shadow(2px 2px 0 #24322C); opacity: 0; }
  .sticker.go { animation: flyin 1.3s cubic-bezier(.45,.05,.55,.95) forwards; }
  @keyframes flyin {
    0% { opacity: 1; transform: translate(150px, -480px) scale(1.9) rotate(-30deg); }
    45% { transform: translate(50px, -260px) scale(1.7) rotate(160deg); }
    78% { transform: translate(0, -36px) scale(1.5) rotate(350deg); }
    88% { transform: scale(1.3, .72) rotate(360deg); }
    95% { transform: scale(.9, 1.12) rotate(360deg); }
    100% { opacity: 1; transform: none; }
  }
  .card .stk { width: 64px; height: 64px; }
  #doneCard { display: none; text-align: center; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar" style="background:var(--cream)"><button class="back">‹</button><h1>받은 스티커</h1></div>
<div class="map"></div>
<div class="target"><img class="sticker" id="stk" src="../img/a18.webp" alt=""></div>
<div class="bottom">
  <div class="card" id="giftCard">
    <div class="row"><div class="av" style="width:40px;height:40px"><img src="../img/c01.webp" alt=""></div><div class="name">골목참새님이 스티커를 보냈어요</div></div>
    <div class="row" style="margin-top:12px">
      <img class="stk" src="../img/a18.webp" alt="">
      <div class="grow"><div class="jua" style="font-size:22px;color:var(--forest)">비 오는 날 골목</div>
        <div class="sub" style="font-size:13px">처마 밑에서 비 구경하기 좋은 곳</div><div class="sub">2026.11.18에 남긴 기록 · 사진 있음</div></div>
    </div>
    <div class="sub" style="margin-top:6px">지도 가운데가 친구가 기록한 자리예요.</div>
    <div class="row" style="margin-top:12px"><button class="btn outline sm" style="flex:1;color:var(--muted)">받지 않기</button><button class="btn orange sm" style="flex:2" onclick="take()">받기</button></div>
  </div>
  <div class="card" id="doneCard">
    <div class="jua" style="font-size:24px;color:var(--forest)">내 지도에 콩 붙었어요!</div>
    <p class="sub" style="font-size:13px;line-height:1.5;margin:4px 0 12px">골목참새님이 보낸 스티커는 이제 내 기록이에요.<br>"내 지도"에서 언제든 보고, 지울 수도 있어요.</p>
    <button class="btn sm" onclick="location.reload()">확인</button>
  </div>
</div>
<script>
  // 받기: 스티커가 화면 위에서 날아와 그 자리에 콩 붙는다
  function take() {
    document.getElementById('stk').classList.add('go');
    setTimeout(() => {
      const t = document.querySelector('.target');
      const ring = document.createElement('div'); ring.className = 'kong kong-ring'; t.appendChild(ring);
      const txt = document.createElement('div'); txt.className = 'kong kong-text'; txt.style.top = '-104px'; txt.textContent = '콩!'; t.appendChild(txt);
      document.getElementById('giftCard').style.display = 'none';
      document.getElementById('doneCard').style.display = 'block';
    }, 1150);
  }
</script>
</body>
</html>
