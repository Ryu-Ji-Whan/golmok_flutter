<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>저장된 기록</title>
<style>
  /* 앱 spot_detail.dart: 지도·내 지도에서 스티커를 누르면 열리는 화면 (아래 탭 없음). 친구가 보낸 스티커면 "○○님이 보낸 스티커" 표시 */
  .appbar .ico { width: 44px; height: 44px; border: 0; background: none; font-size: 20px; color: var(--ink); }
  .photo { position: relative; height: 230px; border-radius: 22px; overflow: hidden; background: var(--peach) url(../img/bench.jpg) center / cover; }
  .photo img { position: absolute; right: 12px; bottom: 12px; width: 88px; height: 88px; object-fit: contain; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill.sand { background: var(--sand); color: var(--muted); }
  .pill.peach { background: var(--peach); color: var(--orangeText); }
  .btn + .btn { margin-top: 10px; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back" aria-label="뒤로">‹</button><h1>저장된 기록</h1><button class="ico" title="고치기" onclick="location.href='Record.dc.html'">✎</button><button class="ico" title="지우기">🗑</button></div>
<div style="padding:4px 16px 0">
  <div class="photo"><img src="../img/a21.webp" alt=""></div>
  <button class="btn outline" style="height:46px;margin-top:10px" onclick="location.href='PhotoEdit.dc.html'">✦ 사진 꾸미기</button>
  <h2 class="jua" style="font-size:26px;margin-top:14px;color:var(--forest)">저녁마다 고양이가 모이는 벤치</h2>
  <div class="pills"><span class="pill sand">2026.11.19</span><span class="pill">나만 보기</span><span class="pill peach">골목참새님이 보낸 스티커</span></div>
  <div class="card" style="margin-top:12px;font-size:15px;line-height:1.6">해 질 무렵 이 벤치에 앉으면 노란 고양이가 꼭 옆에 와서 앉아요.</div>
  <p class="sub" style="margin-top:12px">위치 37.28214, 127.01357</p>
  <div style="margin-top:18px">
    <button class="btn orange" onclick="location.href='SendSticker.dc.html'">➤ 친구에게 스티커 보내기</button>
    <button class="btn outline" onclick="location.href='Share.dc.html'">🖼 카드 사진으로 공유하기</button>
    <button class="btn">⇪ 골목 피드에 공유하기</button>
  </div>
</div>
</body>
</html>
