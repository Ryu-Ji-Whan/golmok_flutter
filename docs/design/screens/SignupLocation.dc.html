<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>위치 권한 안내</title>
<style>
  /* 앱 signup.dart LocationScreen (4/4): 위치 허용하기 / 나중에 할게요 → 어느 쪽이든 내 동네 고르기로 */
  .hd { height: 44px; display: flex; align-items: center; padding: 0 12px 0 16px; margin-top: 8px; }
  .hd .back { width: 44px; height: 44px; border: 0; background: none; font-size: 28px; color: var(--ink); text-align: left; }
  .hd b { margin-left: auto; font-size: 13px; color: var(--muted); }
  .prog { margin: 0 16px; height: 4px; border-radius: 2px; background: var(--lineSoft); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--forest); }
  .body { position: absolute; top: 103px; bottom: 120px; left: 0; right: 0; overflow-y: auto; padding: 20px 24px 16px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .body h2 { font-family: 'Jua'; font-weight: 400; font-size: 26px; line-height: 1.25; color: var(--forest); }
  .body .subt { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .foot { position: absolute; left: 24px; right: 24px; bottom: 28px; }
  .rs { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .rs .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--mint); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .rs b { display: block; font-size: 15px; } .rs span { font-size: 13px; color: var(--muted); }
  .body { bottom: 160px; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="hd"><button class="back" aria-label="뒤로">‹</button><b>4 / 4</b></div>
<div class="prog"><i style="width:100%"></i></div>
<div class="body">
  <h2>걸은 골목을 밝히려면<br>위치가 필요해요</h2>
  
  <div style="height:20px"></div>
  <div style="text-align:center"><img src="../img/c04.webp" alt="" style="width:150px;height:150px;object-fit:contain"></div>
  <div style="height:20px"></div>
  <div class="rs"><div class="ic">〰</div><div><b>산책 경로 그리기</b><span>걸은 길을 지도 위에 선으로 남겨요</span></div></div>
  <div class="rs"><div class="ic">☁</div><div><b>안개 걷기</b><span>지나간 골목의 안개가 걷혀요</span></div></div>
  <div class="rs"><div class="ic">🔒</div><div><b>내 폰에만 저장</b><span>기록은 공유를 고른 것만 이웃에게 보여요</span></div></div>

<div class="foot"><button class="btn" onclick="location.href='SignupArea.dc.html'">◎ 위치 허용하기</button><div style="text-align:center;font-size:14px;color:var(--muted);padding:12px 0 0" onclick="location.href='SignupArea.dc.html'">나중에 할게요</div></div>
