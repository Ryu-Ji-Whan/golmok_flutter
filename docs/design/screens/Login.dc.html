<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>로그인</title>
<style>
  /* 앱 login.dart: 아이디·비밀번호 + 카카오 + 로그인 없이 둘러보기 (구글·Apple 버튼 없음) */
  .wrap { padding: 0 24px; text-align: center; }
  .logo { font-size: 44px; color: var(--forest); line-height: 1.1; }
  .field { position: relative; height: 56px; border: 1px solid var(--line); border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; }
  .field .ic { width: 22px; color: var(--muted); font-size: 18px; text-align: center; }
  .field label { position: absolute; left: 12px; top: -9px; padding: 0 4px; background: var(--cream); font-size: 12px; color: var(--muted); }
  .field .v { flex: 1; font-size: 16px; }
  .links { display: flex; align-items: center; justify-content: center; gap: 2px; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .links a { padding: 10px 8px; text-decoration: none; }
  .or { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; font-size: 12px; color: var(--muted); }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .kakao { height: 54px; width: 100%; border: 0; border-radius: 27px; background: #FEE500; color: #191600; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="status"><span>9:41</span><i></i></div>
<div class="appbar"><button class="back" aria-label="뒤로">‹</button></div>
<div class="wrap">
  <div class="jua logo">골목대장</div>
  <p style="font-size:15px;color:var(--muted);margin-top:4px">내가 걸은 골목이 지도로 남아요</p>
  <img src="../img/a04.webp" alt="" style="width:120px;height:120px;object-fit:contain;margin:10px 0 18px">
  <div class="field"><label>아이디</label><span class="ic">👤</span><span class="v">golmok_cat</span></div>
  <div class="field" style="margin-top:14px"><label>비밀번호</label><span class="ic">🔒</span><span class="v" style="letter-spacing:3px">••••••••</span><span class="ic">👁</span></div>
  <button class="btn" style="height:54px;margin-top:16px">로그인</button>
  <div class="links">처음이에요?<a href="AccountSignup.dc.html" style="color:var(--forest);font-weight:700;font-size:14px">회원가입</a>·<a href="ForgotPassword.dc.html" style="color:var(--muted)">아이디·비밀번호 찾기</a></div>
  <div class="or">또는</div>
  <button class="kakao" onclick="location.href='AuthLoading.dc.html'">카카오로 계속하기</button>
  <div style="margin-top:10px;font-size:13px;color:var(--muted);padding:8px">로그인 없이 둘러보기</div>
  <p style="font-size:11px;color:var(--muted)">로그인하면 기록이 내 계정에 저장돼서 폰을 바꿔도 이어져요</p>
</div>
</body>
</html>
