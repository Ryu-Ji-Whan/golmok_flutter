# 골목대장 Flutter 설치 파일 자동 빌드
# GitHub에 올리면(또는 Actions 탭에서 "Run workflow") 아래 두 파일을 만들어 Releases에 올려 준다.
#   - golmok-flutter.apk          : Android 폰에 바로 설치
#   - golmok-flutter-unsigned.ipa : iPhone용. Sideloadly + 내 Apple ID로 서명해서 설치
# android/ ios/ 폴더는 저장소에 두지 않고, 빌드할 때마다 'flutter create .' 로 새로 만든다.

name: Build Flutter app

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'supabase/**']   # 설명·문서만 바꿨을 때는 다시 빌드하지 않는다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCATION_TEXT: 걸은 골목을 지도에 밝히고 산책 경로를 기록하려고 위치를 써요

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android project
        run: |
          flutter create --platforms=android --org kr.golmok --project-name golmok_flutter .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          # 인터넷(지도 타일)·위치 권한, 앱 이름
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="골목대장"#' $M
          grep -n "permission\|android:label" $M

      - name: Install packages
        run: flutter pub get

      - name: Analyze & test (경고만, 빌드는 계속)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || echo "::warning title=Analyze::Dart 코드 검사에서 문제가 나왔어요. 로그를 확인하세요."
          flutter test || echo "::warning title=Test::테스트가 실패했어요. 로그를 확인하세요."

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk golmok-flutter.apk
          ls -lh golmok-flutter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: golmok-flutter-android
          path: golmok-flutter.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native iOS project
        run: |
          flutter create --platforms=ios --org kr.golmok --project-name golmok_flutter .
          rm -f test/widget_test.dart
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $LOCATION_TEXT" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 골목대장" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 골목대장" $P

      - name: Install packages
        run: flutter pub get

      - name: Build app (no signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry golmok-flutter-unsigned.ipa Payload
          ls -lh golmok-flutter-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: golmok-flutter-ios
          path: golmok-flutter-unsigned.ipa

  release:
    name: Publish to Releases
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-build-${{ github.run_number }}
          name: 골목대장 Flutter 빌드 ${{ github.run_number }}
          make_latest: true
          body: |
            - **golmok-flutter.apk** — Android 폰에서 이 페이지를 열고 눌러서 설치
            - **golmok-flutter-unsigned.ipa** — iPhone: PC의 Sideloadly로 설치
          files: out/*
